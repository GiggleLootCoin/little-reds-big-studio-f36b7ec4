plugins { id 'com.android.application' }

android { namespace 'com.littleredbigstudio.app'; compileSdk 36
    defaultConfig { applicationId 'com.littleredbigstudio.app'; minSdk 23; targetSdk 35; versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1"); versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1") }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

name: Build Little Red's Big Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ android-native-rebuild ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: android-native
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android-native/app/build/outputs/apk/debug/app-debug.apk --title "Little Red's Big Studio $TAG" --notes "Native Android build of Little Red's Big Studio."
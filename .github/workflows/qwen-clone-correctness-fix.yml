name: Qwen clone correctness fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: qwen clone correctness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch clone requirements and ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/studio-runtime-impl.ts')
          s = p.read_text()
          s = s.replace('for (const size of [String(input.model_size ?? "0.6B"), "1.7B"])', 'for (const size of [String(input.model_size ?? "1.7B"), "0.6B"])', 1)
          s = s.replace('        !refText,\n        size,', '        false,\n        size,', 1)
          old = '  if (profile.mode === "clone") {\n    const sample = await getBuddyVoiceSample();'
          new = '  if (profile.mode === "clone") {\n    if (!profile.cloneVerified) throw new Error("Your custom voice is not verified yet. Generate and verify the clone first.");\n    if (!profile.referenceTranscript?.trim()) throw new Error("Your custom voice needs a verified reference transcript before Buddy can speak with it.");\n    const sample = await getBuddyVoiceSample();'
          if old not in s:
              raise SystemExit('clone preparation pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -n 'model_size\|profile.cloneVerified\|referenceTranscript\|false,' src/lib/studio-runtime-impl.ts | head -30
      - name: Typecheck
        run: |
          npm install --package-lock-only --ignore-scripts
          npx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/studio-runtime-impl.ts package-lock.json
          git commit -m 'fix: qwen clone correctness'
          git push

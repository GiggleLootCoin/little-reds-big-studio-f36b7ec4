name: Build Standalone Buddy APK
permissions:
  contents: write

on:
  push:
    branches: [standalone-buddy-native]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        working-directory: standalone-buddy
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK structure and signature
        shell: bash
        run: |
          APK="$(find standalone-buddy/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" /tmp/Buddy-Little-Reds-Big-Studio.apk
          echo "APK=/tmp/Buddy-Little-Reds-Big-Studio.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: buddy-standalone-apk
          path: /tmp/Buddy-Little-Reds-Big-Studio.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish permanent raw GitHub mirror
        id: rawmirror
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin buddy-apk-download 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/buddy-apk-download; then
            git switch --force-create buddy-apk-download origin/buddy-apk-download
          else
            git switch --orphan buddy-apk-download
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
          fi
          mkdir -p downloads
          cp /tmp/Buddy-Little-Reds-Big-Studio.apk downloads/Buddy-Little-Reds-Big-Studio.apk
          cat > downloads/README.txt <<EOF
          Little Red's Big Studio — Buddy native APK
          Build commit: ${GITHUB_SHA}
          SHA-256: $(sha256sum /tmp/Buddy-Little-Reds-Big-Studio.apk | cut -d' ' -f1)
          EOF
          git add downloads/Buddy-Little-Reds-Big-Studio.apk downloads/README.txt
          git diff --cached --quiet || git commit -m "chore: publish Buddy APK ${GITHUB_RUN_NUMBER}"
          git push origin buddy-apk-download
          RAW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/buddy-apk-download/downloads/Buddy-Little-Reds-Big-Studio.apk"
          echo "url=$RAW_URL" >> "$GITHUB_OUTPUT"
          echo "### Permanent raw APK mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "$RAW_URL" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --location --retry 4 --retry-delay 2 -sS -o /dev/null -w 'Raw mirror: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n' "$RAW_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK to Gofile
        id: gofile
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --retry 4 --retry-delay 2 -sS -F 'file=@/tmp/Buddy-Little-Reds-Big-Studio.apk' https://upload.gofile.io/uploadfile)"
          echo "$RESPONSE"
          URL="$(printf '%s' "$RESPONSE" | jq -r '.data.downloadPage // empty')"
          STATUS="$(printf '%s' "$RESPONSE" | jq -r '.status // empty')"
          test "$STATUS" = ok
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Gofile phone download" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "### Stable Supabase APK endpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "https://awkjmzrjfdjvlmdbtnzy.supabase.co/functions/v1/buddy-apk" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --location --retry 4 --retry-delay 2 -sS -o /dev/null -w 'Gofile page: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n' "$URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release with both working download routes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GOFILE_URL: ${{ steps.gofile.outputs.url }}
          RAW_URL: ${{ steps.rawmirror.outputs.url }}
          SUPABASE_URL: https://awkjmzrjfdjvlmdbtnzy.supabase.co/functions/v1/buddy-apk
        run: |
          TAG="buddy-standalone-${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF
          Standalone native Little Red's Big Studio Buddy app.

          PHONE DOWNLOAD (stable Supabase endpoint):
          ${SUPABASE_URL}

          SECONDARY PHONE DOWNLOAD (Gofile):
          ${GOFILE_URL}

          PERMANENT FALLBACK (raw GitHub file):
          ${RAW_URL}

          Commit: ${GITHUB_SHA}
          SHA-256: $(sha256sum /tmp/Buddy-Little-Reds-Big-Studio.apk | cut -d' ' -f1)
          EOF
          gh release create "$TAG" /tmp/Buddy-Little-Reds-Big-Studio.apk --repo "$GITHUB_REPOSITORY" --title "Buddy Standalone APK ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --target "${GITHUB_SHA}"

name: Build Standalone Buddy APK
permissions:
  contents: write

on:
  push:
    branches: [standalone-buddy-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: standalone-buddy
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-standalone-apk
          path: standalone-buddy/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish persistent APK release
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="buddy-standalone-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" standalone-buddy/app/build/outputs/apk/debug/*.apk --repo "$GITHUB_REPOSITORY" --title "Buddy Standalone APK $GITHUB_RUN_NUMBER" --notes "Standalone native Little Red's Big Studio Buddy app. Commit $GITHUB_SHA."

name: Apply Buddy Voice Studio

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Buddy
        run: python3 scripts/install-buddy-voice.py

      - name: Commit Buddy voice integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/studio-runtime.ts src/components/studio/BuddyLiveChat.tsx
          git diff --cached --quiet || git commit -m 'feat: wire Buddy voice profiles into TTS'
          git push

      - name: Validate
        run: |
          npm install
          npm run lint
          npm run build

      - name: Cleanup patch tooling
        if: always()
        run: |
          rm -f scripts/install-buddy-voice.py .github/workflows/apply-buddy-voice.yml .github/workflows/install-buddy-voice.yml .github/voice-install-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u scripts/install-buddy-voice.py .github/workflows/apply-buddy-voice.yml .github/workflows/install-buddy-voice.yml .github/voice-install-trigger.txt
          git diff --cached --quiet || git commit -m 'chore: remove temporary voice installation tooling'
          git push

name: Temporary Red Voice Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add Red voice and migrate saved clone
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/studio/BuddyVoicePicker.tsx")
          s = p.read_text()
          s = s.replace('import { useMemo, useRef, useState } from "react";', 'import { useEffect, useMemo, useRef, useState } from "react";')
          s = s.replace('  const allVoices = useMemo(\n    () => [\n      ...BUDDY_VOICE_PRESETS.map((v) => ({ ...v, family: "Buddy Originals" })),', '  const allVoices = useMemo(\n    () => [\n      {\n        id: "Red",\n        label: "Red — My Voice",\n        note: "Your real verified personal voice clone",\n        nativeLanguage: "English",\n        languages: ["English"],\n        character: "Little Red’s own voice — the required Buddy voice.",\n        family: "Red — Your Voice",\n      },\n      ...BUDDY_VOICE_PRESETS.map((v) => ({ ...v, family: "Buddy Originals" })),')
          s = s.replace('    [],\n  );\n\n  const setGeneratedAudio', '    [],\n  );\n\n  useEffect(() => {\n    let active = true;\n    void getBuddyVoiceSample().then((sample) => {\n      if (!active || !sample) return;\n      const current = getBuddyVoiceProfile();\n      if (current.mode === "preset" || current.speaker !== "Red") {\n        const next = { ...current, mode: "clone" as const, speaker: "Red", cloneVerified: current.cloneVerified };\n        saveBuddyVoiceProfile(next);\n        setProfile(next);\n        setStatus(\"Red — My Voice selected. Buddy will use your saved voice clone.\");\n      }\n    });\n    return () => { active = false; };\n  }, []);\n\n  const setGeneratedAudio')
          s = s.replace('{["Buddy Originals", "Aura Studio — 40 distinct English voices"].map((family) => (', '{["Red — Your Voice", "Buddy Originals", "Aura Studio — 40 distinct English voices"].map((family) => (')
          s = s.replace('onChange={(e) => update({ speaker: e.target.value })}', 'onChange={(e) =>\n            e.target.value === "Red"\n              ? update({ mode: "clone", speaker: "Red" })\n              : update({ mode: "preset", speaker: e.target.value })\n          }')
          p.write_text(s)
      - name: Commit fix
        run: |
          if git diff --quiet -- src/components/studio/BuddyVoicePicker.tsx; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/BuddyVoicePicker.tsx
          git commit -m "fix: make Red the saved personal Buddy voice"
          git push

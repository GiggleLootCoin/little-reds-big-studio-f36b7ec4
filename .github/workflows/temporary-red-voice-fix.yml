name: Temporary Red Voice Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add Red voice and route it to saved clone
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/studio/BuddyVoicePicker.tsx")
          s = p.read_text()
          s = s.replace('import { useMemo, useRef, useState } from "react";', 'import { useEffect, useMemo, useRef, useState } from "react";')
          s = s.replace('  const allVoices = useMemo(\n    () => [\n      ...BUDDY_VOICE_PRESETS.map((v) => ({ ...v, family: "Buddy Originals" })),', '  const allVoices = useMemo(\n    () => [\n      {\n        id: "Red",\n        label: "Red — My Voice",\n        note: "Your real verified personal voice clone",\n        nativeLanguage: "English",\n        languages: ["English"],\n        character: "Little Red’s own voice — the required Buddy voice.",\n        family: "Red — Your Voice",\n      },\n      ...BUDDY_VOICE_PRESETS.map((v) => ({ ...v, family: "Buddy Originals" })),')
          s = s.replace('    [],\n  );\n\n  const setGeneratedAudio', '    [],\n  );\n\n  useEffect(() => {\n    let active = true;\n    void getBuddyVoiceSample().then((sample) => {\n      if (!active || !sample) return;\n      const current = getBuddyVoiceProfile();\n      if (current.mode === "preset" || current.speaker !== "Red") {\n        const next = { ...current, mode: "preset" as const, speaker: "Red" };\n        saveBuddyVoiceProfile(next);\n        setProfile(next);\n        setStatus("Red — My Voice selected. Buddy will use your saved voice clone.");\n      }\n    });\n    return () => { active = false; };\n  }, []);\n\n  const setGeneratedAudio')
          s = s.replace('{["Buddy Originals", "Aura Studio — 40 distinct English voices"].map((family) => (', '{["Red — Your Voice", "Buddy Originals", "Aura Studio — 40 distinct English voices"].map((family) => (')
          s = s.replace('onChange={(e) => update({ speaker: e.target.value })}', 'onChange={(e) => update({ mode: "preset", speaker: e.target.value })}')
          s = s.replace('if (current.mode === "clone") {', 'if (current.mode === "clone" || current.speaker === "Red") {')
          p.write_text(s)
          q = Path("src/components/studio/BuddyLiveChat.tsx")
          s = q.read_text()
          s = s.replace('if (v.mode === "clone") {', 'if (v.mode === "clone" || v.speaker === "Red") {')
          s = s.replace('if (v.mode !== "preset") {', 'if (v.mode !== "preset" || v.speaker === "Red") {')
          q.write_text(s)
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/BuddyVoicePicker.tsx src/components/studio/BuddyLiveChat.tsx
          git rm .github/workflows/temporary-red-voice-fix.yml
          git commit -m "fix: add Red personal voice to Buddy voice list"
          git push

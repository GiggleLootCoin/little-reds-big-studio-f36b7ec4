name: Free Open Validation

on:
  push:
    branches: [main, production-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply Buddy experience improvements
        if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix - apply Buddy experience improvements'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-buddy-experience.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/BuddyVoicePicker.tsx src/components/studio/BuddyLiveChat.tsx src/lib/buddy-agent.ts
          git commit -m "fix - apply Buddy experience improvements"
          git push origin HEAD:main
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Audio artifact regression tests
        run: node --experimental-strip-types --test tests/audio-artifact.test.ts
      - name: Buddy voice regression tests
        run: npm run test:voice
      - name: Buddy live latency regression tests
        run: node --test tests/live-buddy-latency.test.mjs
      - name: Speech language normalization regression test
        run: node --test tests/speech-language-normalization.test.mjs
      - name: Production Android voice smoke contract test
        run: node --test tests/live-voice-browser-smoke.test.mjs
      - name: Buddy orchestrator regression tests
        run: node --test tests/buddy-orchestrator.test.mjs
      - name: Buddy experience contract tests
        run: node --test tests/buddy-experience-contract.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Normalize formatting
        run: npx prettier --write .
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

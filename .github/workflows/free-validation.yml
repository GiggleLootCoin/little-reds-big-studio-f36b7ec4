name: Free Open Validation

on:
  push:
    branches: [main, production-integration, finish-line-independent-deploy]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

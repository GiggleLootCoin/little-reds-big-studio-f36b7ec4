name: Free Open Validation

on:
  push:
    branches: [main, production-integration, finish-line-independent-deploy]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Format source
        run: npx prettier --write src/components/studio/BuddyLiveChat.tsx src/lib/free-runners.ts src/lib/studio-runtime.ts
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/BuddyLiveChat.tsx src/lib/free-runners.ts src/lib/studio-runtime.ts
          git commit -m "style: format finish-line runtime [skip ci]"
          git push
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

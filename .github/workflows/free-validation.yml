name: Free Open Validation

on:
  push:
    branches: [main, production-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Audio artifact regression tests
        run: node --experimental-strip-types --test tests/audio-artifact.test.ts
      - name: Type-check
        run: npx tsc --noEmit
      - name: Normalize formatting
        run: npx prettier --write .
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

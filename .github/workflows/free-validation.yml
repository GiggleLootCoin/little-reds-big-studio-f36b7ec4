name: Free Open Validation

# Includes the persistent Buddy-memory regression suite.
on:
  push:
    branches: [main, production-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Audio artifact regression tests
        run: node --experimental-strip-types --test tests/audio-artifact.test.ts
      - name: Buddy voice regression tests
        run: npm run test:voice
      - name: Buddy memory regression tests
        run: node --test tests/buddy-memory.test.mjs
      - name: Buddy live latency regression tests
        run: node --test tests/live-buddy-latency.test.mjs
      - name: Speech language normalization regression test
        run: node --test tests/speech-language-normalization.test.mjs
      - name: Production Android voice smoke contract test
        run: node --test tests/live-voice-browser-smoke.test.mjs
      - name: Create flow contract tests
        run: node --test tests/create-flow-contract.test.mjs
      - name: Buddy orchestrator regression tests
        run: node --test tests/buddy-orchestrator.test.mjs
      - name: Buddy experience contract tests
        run: node --test tests/buddy-experience-contract.test.mjs
      - name: Buddy cognitive core regression tests
        run: node --test tests/buddy-cognitive-core.test.mjs
      - name: Applio RVC adapter contract tests
        run: node --experimental-strip-types --test tests/rvc-applio.test.mjs
      - name: Type-check
        run: npx tsc --noEmit
      - name: Normalize formatting
        run: npx prettier --write .
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

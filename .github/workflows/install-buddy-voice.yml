name: Install Buddy Voice Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install voice selector and clone support
        run: |
          cat > src/lib/buddy-voice.ts <<'EOF'
          export type BuddyVoiceMode = "preset" | "clone";
          export type BuddyVoiceProfile = {
            mode: BuddyVoiceMode;
            speaker: string;
            language: string;
            referenceDataUrl?: string;
            referenceName?: string;
          };

          export const BUDDY_VOICE_KEY = "lrbgs-buddy-voice-v1";
          export const BUDDY_VOICE_PRESETS = [
            { id: "Ryan", label: "Ryan", note: "English • dynamic, rhythmic" },
            { id: "Aiden", label: "Aiden", note: "English • sunny, clear American" },
            { id: "Vivian", label: "Vivian", note: "Bright, slightly edgy" },
            { id: "Serena", label: "Serena", note: "Warm, gentle" },
            { id: "Uncle_Fu", label: "Uncle Fu", note: "Low, mellow" },
            { id: "Dylan", label: "Dylan", note: "Clear, youthful" },
            { id: "Eric", label: "Eric", note: "Lively, slightly husky" },
            { id: "Ono_anna", label: "Ono Anna", note: "Playful, light" },
            { id: "Sohee", label: "Sohee", note: "Warm, emotional" },
          ] as const;

          const DEFAULT_PROFILE: BuddyVoiceProfile = {
            mode: "preset",
            speaker: "Ryan",
            language: "English",
          };

          export function getBuddyVoiceProfile(): BuddyVoiceProfile {
            if (typeof window === "undefined") return DEFAULT_PROFILE;
            try {
              const parsed = JSON.parse(localStorage.getItem(BUDDY_VOICE_KEY) || "null") as Partial<BuddyVoiceProfile> | null;
              return {
                ...DEFAULT_PROFILE,
                ...parsed,
                mode: parsed?.mode === "clone" ? "clone" : "preset",
                speaker: parsed?.speaker || DEFAULT_PROFILE.speaker,
                language: parsed?.language || DEFAULT_PROFILE.language,
              };
            } catch {
              return DEFAULT_PROFILE;
            }
          }

          export function saveBuddyVoiceProfile(profile: BuddyVoiceProfile) {
            localStorage.setItem(BUDDY_VOICE_KEY, JSON.stringify(profile));
          }

          export function clearBuddyVoiceClone() {
            const profile = getBuddyVoiceProfile();
            saveBuddyVoiceProfile({ mode: "preset", speaker: profile.speaker || "Ryan", language: profile.language || "English" });
          }

          export async function fileToVoiceDataUrl(file: File): Promise<string> {
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result));
              reader.onerror = () => reject(reader.error || new Error("Could not read the voice sample."));
              reader.readAsDataURL(file);
            });
          }

          export async function dataUrlToVoiceBlob(dataUrl: string) {
            const response = await fetch(dataUrl);
            return response.blob();
          }
EOF

          cat > src/components/studio/BuddyVoicePicker.tsx <<'EOF'
          import { useEffect, useState } from "react";
          import { Mic2, Play, Trash2, UserRound, Volume2 } from "lucide-react";
          import { runStudioJob } from "@/lib/studio-runtime";
          import {
            BUDDY_VOICE_PRESETS,
            clearBuddyVoiceClone,
            fileToVoiceDataUrl,
            getBuddyVoiceProfile,
            saveBuddyVoiceProfile,
            type BuddyVoiceMode,
          } from "@/lib/buddy-voice";
          import { StudioButton } from "./ui";

          export function BuddyVoicePicker() {
            const [profile, setProfile] = useState(getBuddyVoiceProfile());
            const [busy, setBusy] = useState(false);
            const [status, setStatus] = useState("Choose Buddy's voice or add your own voice sample.");

            useEffect(() => {
              const onStorage = () => setProfile(getBuddyVoiceProfile());
              window.addEventListener("storage", onStorage);
              return () => window.removeEventListener("storage", onStorage);
            }, []);

            const update = (patch: Partial<typeof profile>) => {
              const next = { ...profile, ...patch };
              setProfile(next);
              saveBuddyVoiceProfile(next);
              setStatus(next.mode === "clone" ? "Your saved voice is selected for Buddy." : `${next.speaker} is selected for Buddy.`);
            };

            const uploadClone = async (file: File) => {
              if (!file.type.startsWith("audio/")) {
                setStatus("Please choose an audio file (WAV, MP3, M4A, OGG or WebM).");
                return;
              }
              if (file.size > 3_500_000) {
                setStatus("That sample is too large. Use a short, clear 3–20 second clip under 3.5 MB.");
                return;
              }
              setBusy(true);
              try {
                const dataUrl = await fileToVoiceDataUrl(file);
                const audio = document.createElement("audio");
                audio.preload = "metadata";
                const duration = await new Promise<number>((resolve, reject) => {
                  audio.onloadedmetadata = () => resolve(audio.duration);
                  audio.onerror = () => reject(new Error("The voice sample could not be read."));
                  audio.src = dataUrl;
                });
                if (!Number.isFinite(duration) || duration < 2 || duration > 30)
                  throw new Error("Use a clear voice sample between 2 and 30 seconds.");
                update({ mode: "clone" as BuddyVoiceMode, referenceDataUrl: dataUrl, referenceName: file.name });
                setStatus("Voice saved. Buddy will use it for generated speech.");
              } catch (error) {
                setStatus(error instanceof Error ? error.message : "Voice sample could not be saved.");
              } finally {
                setBusy(false);
              }
            };

            const preview = async () => {
              setBusy(true);
              setStatus("Generating a real voice preview…");
              try {
                const current = getBuddyVoiceProfile();
                const input: Record<string, unknown> = {
                  text: "Hi. I'm Buddy, and this is my voice from Little Red's Big Studio.",
                  language: current.language,
                };
                if (current.mode === "clone" && current.referenceDataUrl) {
                  input.referenceAudio = await (await fetch(current.referenceDataUrl)).blob();
                } else {
                  input.speaker = current.speaker;
                }
                const result = await runStudioJob("tts", input, setStatus);
                if (!result.url) throw new Error("No usable voice preview was returned.");
                const audio = new Audio(result.url);
                await audio.play();
                setStatus("Voice preview is playing.");
              } catch (error) {
                setStatus(error instanceof Error ? error.message : "Voice preview failed; Buddy will keep its browser fallback.");
              } finally {
                setBusy(false);
              }
            };

            return (
              <div className="mt-3 rounded-2xl border border-primary/20 bg-primary/5 p-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <Volume2 className="size-4 text-primary" />
                    <div>
                      <p className="text-xs font-bold uppercase tracking-[0.14em]">Buddy's voice</p>
                      <p className="text-[10px] text-muted-foreground">Preset voices or your own authorized voice</p>
                    </div>
                  </div>
                  <StudioButton variant="ghost" onClick={() => void preview()} disabled={busy}>
                    <Play className="size-3.5" /> Preview
                  </StudioButton>
                </div>

                <div className="mt-3 grid grid-cols-2 gap-2">
                  <button type="button" onClick={() => update({ mode: "preset" })} className={`rounded-xl border px-3 py-2 text-left text-xs ${profile.mode === "preset" ? "border-primary bg-primary/10" : "border-border bg-background/40"}`}>
                    <UserRound className="mb-1 size-4 text-primary" /> Preset voice
                  </button>
                  <label className={`cursor-pointer rounded-xl border px-3 py-2 text-left text-xs ${profile.mode === "clone" ? "border-primary bg-primary/10" : "border-border bg-background/40"}`}>
                    <Mic2 className="mb-1 size-4 text-primary" /> Use my voice
                    <input className="sr-only" type="file" accept="audio/*" onChange={(event) => { const file = event.target.files?.[0]; if (file) void uploadClone(file); event.currentTarget.value = ""; }} />
                  </label>
                </div>

                {profile.mode === "preset" ? (
                  <select value={profile.speaker} onChange={(event) => update({ speaker: event.target.value })} className="mt-2 w-full rounded-xl border border-border bg-background/70 px-3 py-2 text-xs">
                    {BUDDY_VOICE_PRESETS.map((voice) => <option key={voice.id} value={voice.id}>{voice.label} — {voice.note}</option>)}
                  </select>
                ) : (
                  <div className="mt-2 flex items-center justify-between gap-2 rounded-xl border border-primary/20 bg-background/50 px-3 py-2 text-xs">
                    <span className="min-w-0 truncate">{profile.referenceName || "Saved voice sample"}</span>
                    <button type="button" onClick={() => { clearBuddyVoiceClone(); setProfile(getBuddyVoiceProfile()); setStatus("Returned Buddy to the selected preset voice."); }} className="shrink-0 rounded-lg p-1.5 text-muted-foreground hover:text-foreground" aria-label="Remove saved voice"><Trash2 className="size-3.5" /></button>
                  </div>
                )}
                <p className="mt-2 text-[10px] text-muted-foreground" aria-live="polite">{busy ? "Working… " : ""}{status}</p>
                <p className="mt-1 text-[9px] text-muted-foreground">For voice cloning, only upload a voice you own or have permission to use.</p>
              </div>
            );
          }
EOF

          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('src/lib/studio-runtime.ts')
          text = runtime.read_text()

          start = text.index('function pick(')
          end = text.index('function fallback(', start)
          replacement = '''async function buddyVoiceInput(input: StudioJobInput): Promise<StudioJobInput> {
            if (typeof window === "undefined") return input;
            try {
              const raw = localStorage.getItem("lrbgs-buddy-voice-v1");
              if (!raw) return input;
              const profile = JSON.parse(raw) as { mode?: string; speaker?: string; language?: string; referenceDataUrl?: string };
              const next: StudioJobInput = { ...input };
              if (next.language == null && profile.language) next.language = profile.language;
              if (profile.mode === "clone" && profile.referenceDataUrl && next.referenceAudio == null) {
                next.referenceAudio = await (await fetch(profile.referenceDataUrl)).blob();
              } else if (next.speaker == null && profile.speaker) {
                next.speaker = profile.speaker;
              }
              return next;
            } catch {
              return input;
            }
          }

          function pick(name: string, input: StudioJobInput) {
            const n = norm(name);
            for (const [k, v] of Object.entries(input)) if (norm(k) === n && v != null) return v;
            const aliases: Record<string, string[]> = {
              prompt: ["prompt", "text", "message", "query", "question", "lyrics"],
              text: ["text", "prompt", "message", "lyrics", "targettext"],
              audio: ["audio", "inputaudio", "sourceaudio", "referenceaudio", "refaudio", "file"],
              image: ["image", "inputimage", "sourceimage", "file"],
              video: ["video", "inputvideo", "file"],
              lyrics: ["lyrics", "lyric", "text", "prompt"],
              history: ["history", "messages", "conversation"],
              speaker: ["speaker", "voice", "voicename", "speakername"],
              language: ["language", "lang"],
              instruct: ["instruct", "instruction", "style", "voiceprompt", "voicedescription"],
              reftext: ["reftext", "referencetext", "transcript"],
            };
            for (const a of aliases[n] ?? []) for (const [k, v] of Object.entries(input)) if (norm(k) === norm(a) && v != null) return v;
            if (n.includes("history") || n.includes("conversation")) return input.history ?? input.messages ?? [];
            if (n.includes("speaker") || n.includes("voice")) return input.speaker ?? input.voice;
            if (n.includes("language") || n === "lang") return input.language ?? "English";
            if (n.includes("reftext") || n.includes("referencetext")) return input.referenceText;
            if (n.includes("instruct") || n.includes("instruction") || n.includes("style")) return input.instruct ?? input.voiceDesign;
            if (n.includes("image")) return input.image;
            if (n.includes("audio") || n.includes("refaudio") || n.includes("referenceaudio")) return input.audio ?? input.refAudio ?? input.referenceAudio;
            if (n.includes("video")) return input.video;
            return undefined;
          }

          '''
          text = text[:start] + replacement + text[end:]

          old = 'export async function runStudioJob(capability: StudioCapability, input: StudioJobInput, onStatus?: (s: string) => void): Promise<StudioArtifact> { const providers = runnersFor(capability);'
          if old in text:
            new = 'export async function runStudioJob(capability: StudioCapability, input: StudioJobInput, onStatus?: (s: string) => void): Promise<StudioArtifact> { const resolvedInput = capability === "tts" ? await buddyVoiceInput(input) : input; const providers = runnersFor(capability);'
            text = text.replace(old, new, 1)
            text = text.replace('runOn(p, input, capability)', 'runOn(p, resolvedInput, capability)', 1)
          else:
            text = re.sub(r'export async function runStudioJob\(capability: StudioCapability, input: StudioJobInput, onStatus\?: \(s: string\) => void\): Promise<StudioArtifact> \{', 'export async function runStudioJob(capability: StudioCapability, input: StudioJobInput, onStatus?: (s: string) => void): Promise<StudioArtifact> { const resolvedInput = capability === "tts" ? await buddyVoiceInput(input) : input;', text, count=1)
            text = text.replace('runOn(p, input, capability)', 'runOn(p, resolvedInput, capability)', 1)

          runtime.write_text(text)

          buddy = Path('src/components/studio/BuddyLiveChat.tsx')
          b = buddy.read_text()
          if 'BuddyVoicePicker' not in b:
            b = b.replace('import "./BuddyVisual.css";', 'import "./BuddyVisual.css";\nimport { BuddyVoicePicker } from "./BuddyVoicePicker";')
          marker = '<div className="relative mt-5 grid gap-3 sm:grid-cols-2">'
          if '<BuddyVoicePicker />' not in b:
            if marker not in b:
              raise SystemExit('BuddyLiveChat voice insertion marker not found')
            b = b.replace(marker, '<BuddyVoicePicker />\n        ' + marker, 1)
          buddy.write_text(b)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/buddy-voice.ts src/components/studio/BuddyVoicePicker.tsx src/lib/studio-runtime.ts src/components/studio/BuddyLiveChat.tsx
          git diff --cached --quiet || git commit -m 'feat: add free Buddy voice selection and voice cloning'
          git push

      - name: Validate
        run: |
          npm install
          npm run lint
          npm run build

      - name: Remove one-shot installer
        if: always()
        run: |
          rm -f .github/workflows/install-buddy-voice.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/install-buddy-voice.yml
          git diff --cached --quiet || git commit -m 'chore: remove one-shot voice installer'
          git push

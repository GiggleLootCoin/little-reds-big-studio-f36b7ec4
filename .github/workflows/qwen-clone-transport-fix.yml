name: Qwen clone transport fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: qwen clone direct transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Qwen source ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/studio-runtime-impl.ts')
          s = p.read_text()
          old = 'const sources = typeof window === "undefined" ? [id] : [proxyOrigin(id), id];'
          new = 'const sources = typeof window === "undefined" ? [id] : [id, proxyOrigin(id)];'
          if old not in s:
              raise SystemExit('expected source ordering not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -n 'const sources' src/lib/studio-runtime-impl.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/studio-runtime-impl.ts
          git commit -m 'fix: qwen clone direct transport'
          git push

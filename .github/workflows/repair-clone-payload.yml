name: Repair clone payload

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair clone payload serialization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Blob serialization for Cloudflare clone gateway
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/studio-runtime-impl.ts')
          s = p.read_text()
          old = '''  if (input.audio instanceof Blob) payload.audio = input.audio;\n  const response = await fetch(provider.url, {\n    method: "POST",\n    body: JSON.stringify(payload),\n    headers: { "content-type": "application/json" },\n  });'''
          new = '''  if (input.audio instanceof Blob) {\n    const bytes = new Uint8Array(await input.audio.arrayBuffer());\n    let binary = "";\n    const chunkSize = 0x8000;\n    for (let i = 0; i < bytes.length; i += chunkSize) {\n      binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));\n    }\n    payload.audioBase64 = btoa(binary);\n  }\n  const response = await fetch(provider.url, {\n    method: "POST",\n    body: JSON.stringify(payload),\n    headers: { "content-type": "application/json" },\n  });'''
          if old not in s:
              raise SystemExit('Expected clone payload block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/studio-runtime-impl.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair clone payload serialization"
          git push origin HEAD:main
      - name: Trigger production deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Remove temporary repair workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/repair-clone-payload.yml
          git rm -f .github/workflows/repair-clone-payload.yml
          git commit -m "chore: remove temporary clone repair workflow" || true
          git push origin HEAD:main || true

name: Buddy Live Voice Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Android hands-free voice path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/studio/BuddyLiveChat.tsx')
          text = path.read_text()

          old = '''  async function beginCapture(mode: Mode) {
    if (busyRef.current || speakingRef.current || recording) return;
    const stream = streamRef.current?.active ? streamRef.current : await openMicrophone();
    if (!stream) return;
    if (mode === "live") {
      // Hands-free deliberately uses a real microphone recording segment and the
      // server-side Whisper route. This avoids Android/Web Speech implementations
      // that appear to start but never deliver a usable transcript.
      startMediaRecorder("live", stream);
      window.setTimeout(() => {
        if (liveRef.current && recorderRef.current?.state === "recording") {
          try {
            recorderRef.current.stop();
          } catch {}
        }
      }, 6500);
      return;
    }
    if (mode === "record") {
      if (startBrowserRecognition("record")) return;
      startMediaRecorder("record", stream);
      return;
    }
  }
'''

          new = '''  async function beginCapture(mode: Mode) {
    if (busyRef.current || speakingRef.current || recording) return;

    // On Android/iOS browsers, prefer the browser's native speech path for
    // hands-free mode. It talks directly to the phone microphone and avoids
    // depending on a remote STT provider merely to keep a conversation going.
    if (mode === "live" && startBrowserRecognition("live")) return;

    const stream = streamRef.current?.active ? streamRef.current : await openMicrophone();
    if (!stream) return;
    if (mode === "live") {
      // Server STT remains the fallback for browsers without SpeechRecognition.
      startMediaRecorder("live", stream);
      window.setTimeout(() => {
        if (liveRef.current && recorderRef.current?.state === "recording") {
          try {
            recorderRef.current.stop();
          } catch {}
        }
      }, 6500);
      return;
    }
    if (mode === "record") {
      if (startBrowserRecognition("record")) return;
      startMediaRecorder("record", stream);
      return;
    }
  }
'''

          if old not in text:
              raise SystemExit('Expected beginCapture block was not found')
          text = text.replace(old, new, 1)

          old = '''    setLive(true);
    liveRef.current = true;
    setStatus("Requesting your phone microphone…");
    window.speechSynthesis?.resume();
    const stream = await openMicrophone();
    if (!stream) {
      liveRef.current = false;
      setLive(false);
      return;
    }
    setStatus("Microphone ready. Buddy is listening…");
    await beginCapture("live");
    if (!recorderRef.current) {
      liveRef.current = false;
      setLive(false);
      setStatus("Buddy could not start the phone microphone recorder. Try again.");
    }
'''

          new = '''    setLive(true);
    liveRef.current = true;
    setStatus("Starting hands-free Buddy…");
    window.speechSynthesis?.resume();

    // Do not require getUserMedia/MediaRecorder when the browser can provide
    // native speech recognition. This is the reliable Android phone-mic path.
    if (startBrowserRecognition("live")) {
      setStatus("Microphone ready. Buddy is listening…");
      return;
    }

    const stream = await openMicrophone();
    if (!stream) {
      liveRef.current = false;
      setLive(false);
      return;
    }
    setStatus("Microphone ready. Buddy is listening…");
    await beginCapture("live");
    if (!recorderRef.current && !recognitionRef.current) {
      liveRef.current = false;
      setLive(false);
      setStatus("Buddy could not start hands-free microphone input. Try again.");
    }
'''

          if old not in text:
              raise SystemExit('Expected toggleLive block was not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/studio/BuddyLiveChat.tsx
          git diff --cached --quiet || git commit -m 'fix: make Buddy hands-free voice use phone mic'
          git push

      - name: Remove one-shot patch workflow
        run: |
          rm -f .github/workflows/buddy-live-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/buddy-live-fix.yml
          git diff --cached --quiet || git commit -m 'chore: remove one-shot Buddy live fix workflow'
          git push

name: Final Buddy Voice Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Apply final Buddy voice fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runtime and preset Voice Lab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Add the missing production preset-TTS endpoint. The runtime already
          # points preset TTS at /api/ai/tts, but the Worker did not expose it.
          p = Path('src/worker.ts')
          s = p.read_text()
          marker = 'async function reliableMusic(request: Request, env: Env): Promise<Response> {'
          if 'async function reliablePresetTTS(' not in s:
              fn = '''async function reliablePresetTTS(request: Request, env: Env): Promise<Response> {
  if (!env.AI) return jsonError("Cloudflare Workers AI binding is not configured.", 503);
  let body: { text?: string; speaker?: string; language?: string };
  try {
    body = await request.json();
  } catch {
    return jsonError("Invalid voice request.", 400);
  }
  const text = String(body.text || "").trim().slice(0, 600);
  if (!text) return jsonError("Voice text is required.", 400);
  const language = String(body.language || "English").trim();
  // Stable mapping from Buddy's friendly preset IDs to real Aura speakers.
  // These are distinct server-side voices; provider names remain hidden from users.
  const speakers: Record<string, string> = {
    Ryan: "angus",
    Aiden: "orion",
    Vivian: "asteria",
    Serena: "luna",
    Uncle_Fu: "zeus",
    Dylan: "perseus",
    Eric: "helios",
    Ono_Anna: "stella",
    Sohee: "athena",
  };
  const speaker = speakers[String(body.speaker || "Ryan")] || "angus";
  // Aura-1 is English; keep the existing multilingual Qwen fallback for other languages.
  if (language.toLowerCase() !== "english" && language.toLowerCase() !== "en")
    return jsonError("The fast preset voice engine currently serves English presets; use the multilingual fallback.", 503);
  try {
    const audio = await env.AI.run("@cf/deepgram/aura-1", {
      text,
      speaker,
      encoding: "mp3",
    }, { returnRawResponse: true });
    return new Response(audio as BodyInit, {
      status: 200,
      headers: {
        "content-type": "audio/mpeg",
        "cache-control": "no-store",
        "x-tts-provider": "Buddy Voice Engine",
        "x-tts-speaker": speaker,
      },
    });
  } catch (error) {
    console.error("Preset TTS failed", error);
    return jsonError("The selected Buddy voice could not be generated.", 503);
  }
}

'''
              if marker not in s: raise SystemExit('worker insertion marker not found')
              s = s.replace(marker, fn + marker, 1)
          route = '    if (path === "/api/ai/tts" && request.method === "POST") return reliablePresetTTS(request, env);\n'
          if '/api/ai/tts' not in s:
              anchor = '    if (path === "/api/ai/speech-to-text" && request.method === "POST")\n      return reliableSpeechToText(request, env);\n'
              if anchor not in s: raise SystemExit('worker route anchor not found')
              s = s.replace(anchor, route + anchor, 1)
          p.write_text(s)

          # 2) Make the Voice Lab actually preview presets. The old UI only changed
          # the select value; it never gave a preset a playable test action.
          p = Path('src/components/studio/BuddyVoicePicker.tsx')
          s = p.read_text()
          fn_marker = '  const handleGenerateClick = () => {'
          if 'const previewPreset = async () =>' not in s:
              fn = '''  const previewPreset = async () => {
    const current = getBuddyVoiceProfile();
    if (current.speaker === "Red") {
      setStatus("Red is your personal voice. Use the live Buddy call or Generate My Voice Clone to test it.");
      return;
    }
    setBusy(true);
    setStatus(`Previewing ${allVoices.find((v) => v.id === current.speaker)?.label || current.speaker}…`);
    try {
      const result = await runStudioJob(
        "tts",
        {
          text: "Hi, I'm Buddy. This is a quick preview of the voice you've selected.",
          target_text: "Hi, I'm Buddy. This is a quick preview of the voice you've selected.",
          language: current.language || "English",
          speaker: current.speaker,
          model_size: "1.7B",
        },
        setStatus,
      );
      if (!result.url) throw new Error("The selected voice returned no playable audio.");
      setGeneratedAudio(result.url);
      setStatus("✓ Preview ready. Press Play below, then choose this voice if you like it.");
    } catch (error) {
      setStatus(error instanceof Error ? error.message : "The selected voice could not be previewed.");
    } finally {
      setBusy(false);
    }
  };

'''
              if fn_marker not in s: raise SystemExit('picker function marker not found')
              s = s.replace(fn_marker, fn + fn_marker, 1)
          select_end = '        </select>\n      ) : ('
          if select_end not in s: raise SystemExit('picker select marker not found')
          preview = '''        </select>
        <div className="mt-2 rounded-xl border border-primary/30 bg-background/60 p-3">
          <div className="text-xs font-semibold">Listen before you choose</div>
          <p className="mt-1 text-[10px] text-muted-foreground">
            Preview the selected voice first. If you like it, leave it selected and Buddy will use it.
          </p>
          <StudioButton
            type="button"
            className="mt-2 w-full justify-center"
            onClick={() => void previewPreset()}
            disabled={busy}
            aria-busy={busy}
          >
            <Volume2 className="size-4" /> {busy ? "Generating Preview…" : "▶ Play Voice Preview"}
          </StudioButton>
          {audioUrl && (
            <div className="mt-2 rounded-xl border border-border bg-background/70 p-2">
              <audio className="w-full" controls preload="auto" src={audioUrl} />
              <p className="mt-1 text-[9px] text-muted-foreground">Like this one? Keep it selected — Buddy will use it.</p>
            </div>
          )}
        </div>
      ) : ('''
          s = s.replace(select_end, preview, 1)
          # 3) Preset test path must use TTS, not voice-clone, even if called elsewhere.
          old = '''      const result = await runStudioJob(
        "voice-clone",
        {
          speaker: current.speaker,'''
          if old in s:
              new = '''      const result = await runStudioJob(
        "tts",
        {
          speaker: current.speaker,'''
              s = s.replace(old, new, 1)
          p.write_text(s)

          # 4) Do not deliberately select the unverified 0.6B Red live path.
          p = Path('src/components/studio/BuddyLiveChat.tsx')
          s = p.read_text()
          s = s.replace('model_size: liveRef.current ? "0.6B" : "1.7B",', 'model_size: "1.7B",')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit final fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker.ts src/components/studio/BuddyVoicePicker.tsx src/components/studio/BuddyLiveChat.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final Buddy voice fix'
          git push origin main

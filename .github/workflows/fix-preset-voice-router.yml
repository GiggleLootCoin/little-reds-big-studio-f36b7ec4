name: Preset voice route verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify production preset route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("src/worker.ts").read_text()
          assert 'path === "/api/ai/tts"' in s
          assert "studioServer.fetch(request, env, ctx)" in s
          assert 'reliablePresetTTS(request, env)' not in s
          s=Path("src/server.ts").read_text()
          assert '@cf/deepgram/aura-2-en' in s
          assert '@cf/deepgram/aura-2-es' in s
          print("Preset TTS routes through the production Aura-2 handler.")
          PY
      - name: Typecheck and build
        run: |
          npm ci
          npm run typecheck --if-present
          npm run build --if-present

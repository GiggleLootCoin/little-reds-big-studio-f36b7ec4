name: Buddy Voice Hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Apply Buddy voice hotfix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch voice runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/free-runners.ts')
          s = p.read_text()
          s = s.replace('id: "cf-whisper-large-v3-turbo",', 'id: "cf-whisper-large-v3",')
          s = s.replace('name: "Cloudflare Whisper Large V3 Turbo",', 'name: "Cloudflare Whisper Large V3",')
          s = s.replace('description: "Primary server-side speech-to-text engine for Buddy microphone input.",', 'description: "Primary server-side speech-to-text engine for Buddy microphone input without the rejected Turbo route.",')
          block = re.search(r'(id: "cf-buddy-tts",.*?priority:) 500,', s, re.S)
          if block:
              s = s[:block.start(1)] + block.group(1) + '1300,' + s[block.end():]
          s = re.sub(r'\n  \{\n    id: "hf-chatterbox-turbo",.*?\n  \},', '', s, flags=re.S)
          p.write_text(s)

          p = Path('src/lib/studio-runtime-impl.ts')
          s = p.read_text()
          s = s.replace('for (let attempt = 0; attempt < 3; attempt++) {', 'for (let attempt = 0; attempt < 1; attempt++) {')
          s = s.replace('await new Promise((r) => setTimeout(r, 700 * (attempt + 1)));', 'await new Promise((r) => setTimeout(r, 150));')
          s = s.replace('const timeoutMs =\n    prepared.capability === "music"\n      ? 600000\n      : prepared.capability === "video"\n        ? 360000\n        : prepared.capability === "image"\n          ? 180000\n          : 120000;', 'const timeoutMs =\n    prepared.capability === "music"\n      ? 600000\n      : prepared.capability === "video"\n        ? 360000\n        : prepared.capability === "image"\n          ? 180000\n          : prepared.capability === "voice-clone"\n            ? 90000\n            : prepared.capability === "tts"\n              ? 25000\n              : prepared.capability === "chat"\n                ? 30000\n                : 120000;')
          marker = 'const providers = runnersFor(prepared.capability).filter((provider) => !skipped.has(provider.id));'
          replacement = 'const providers = runnersFor(prepared.capability).filter((provider) => {\n    if (skipped.has(provider.id)) return false;\n    if (prepared.capability === "tts" && ["hf-chatterbox", "hf-chatterbox-v3"].includes(provider.id)) return false;\n    return true;\n  });'
          s = s.replace(marker, replacement)
          p.write_text(s)

          p = Path('src/components/studio/BuddyLiveChat.tsx')
          s = p.read_text()
          s = s.replace('model_size: liveRef.current ? "0.6B" : "1.7B",', 'model_size: "1.7B",')
          s = s.replace('speaker: v.speaker,\n            mood:', 'speaker: v.speaker,\n            model_size: "1.7B",\n            mood:')
          p.write_text(s)
          PY
      - name: Verify changes
        run: |
          grep -n 'cf-buddy-tts\|cf-whisper-large-v3\|hf-chatterbox-turbo' src/lib/free-runners.ts || true
          grep -n 'prepared.capability === "tts"\|attempt < 1' src/lib/studio-runtime-impl.ts
          grep -n 'model_size:' src/components/studio/BuddyLiveChat.tsx
          npm ci --no-audit --no-fund
          npx prettier --write .
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/free-runners.ts src/lib/studio-runtime-impl.ts src/components/studio/BuddyLiveChat.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Buddy voice hotfix'
          git push origin main

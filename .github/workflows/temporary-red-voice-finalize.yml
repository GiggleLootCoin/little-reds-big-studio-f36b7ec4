name: Temporary Red Voice Finalize

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Make Red visible while routing to the saved clone
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/studio/BuddyVoicePicker.tsx")
          s = p.read_text()
          s = s.replace('const next = { ...current, mode: "clone" as const, speaker: "Red", cloneVerified: current.cloneVerified };', 'const next = { ...current, mode: "preset" as const, speaker: "Red" };')
          s = s.replace('e.target.value === "Red"\n              ? update({ mode: "clone", speaker: "Red" })', 'e.target.value === "Red"\n              ? update({ mode: "preset", speaker: "Red" })')
          p.write_text(s)
      - name: Remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/studio/BuddyVoicePicker.tsx
          git rm .github/workflows/temporary-red-voice-finalize.yml .red-voice-trigger
          git commit -m "fix: keep Red personal voice visible at top of Buddy list"
          git push

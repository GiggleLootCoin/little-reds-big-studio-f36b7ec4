name: Apply Buddy preset voice fix

on:
  push:
    branches: [fix/buddy-preset-voice-selection]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch preset selection and Red wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/lib/studio-runtime-impl.ts')
          text = runtime.read_text()
          old = '  next.speaker = profile.speaker;\n'
          new = '''  // Preserve an explicit speaker supplied by the caller (especially the\n  // uncommitted preview selection). Falling back to the saved profile keeps\n  // normal Buddy TTS behaviour unchanged.\n  const requestedSpeaker = String(input.speaker ?? \"\").trim();\n  next.speaker = requestedSpeaker || profile.speaker;\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected runtime speaker assignment was not found exactly once')
          runtime.write_text(text.replace(old, new, 1))

          picker = Path('src/components/studio/BuddyVoicePicker.tsx')
          text = picker.read_text()
          replacements = {
              'label: \"Red — My Voice\"': 'label: \"Red — The Original Voice of Buddy\"',
              'family: \"Red — Your Voice\"': 'family: \"Buddy\'s Original Voice\"',
              '[\"Red — Your Voice\", \"Buddy Originals\", \"Aura Studio — 40 distinct English voices\"]': '[\"Buddy\'s Original Voice\", \"Buddy Originals\", \"Aura Studio — 40 distinct English voices\"]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected picker text not found: {old}')
              text = text.replace(old, new, 1)
          picker.write_text(text)
          PY

      - name: Verify TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit source fix and remove one-shot patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/studio-runtime-impl.ts src/components/studio/BuddyVoicePicker.tsx
          git rm .github/workflows/apply-preset-voice-fix.yml
          git commit -m 'fix: preserve selected Buddy preset during preview [auto-fix]'
          git push

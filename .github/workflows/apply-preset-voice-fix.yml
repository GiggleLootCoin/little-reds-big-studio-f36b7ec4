name: Apply preset voice selection fix

on:
  push:
    branches:
      - fix/preset-selection-actually-controls-buddy-voice-20260911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch preset voice selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/studio/BuddyLiveChat.tsx")
          s = p.read_text()
          old = '''      if (v.mode === "clone" || v.speaker === "Red") {\n        let sample: Blob | null = null;\n        if (v.mode === "clone") sample = await getBuddyVoiceSample();\n        else sample = await getBuiltInRedVoiceSample();'''
          new = '''      // An explicitly selected non-Red preset must always win over any saved clone state.\n      // The old condition treated every clone-mode profile as Red, even when a preset\n      // speaker had been selected, so Buddy reused the saved 30-second Red sample.\n      if (v.speaker === "Red" || (v.mode === "clone" && !v.speaker)) {\n        let sample: Blob | null = null;\n        if (v.mode === "clone") sample = await getBuddyVoiceSample();\n        else sample = await getBuiltInRedVoiceSample();'''
          if old not in s:
              raise SystemExit("Expected voice-routing block was not found")
          p.write_text(s.replace(old, new, 1))

          t = Path("tests/buddy-experience-contract.test.mjs")
          ts = t.read_text()
          ts = ts.replace('assert.match(chat, /v\\.mode === "clone" \\|\\| v\\.speaker === "Red"/);', 'assert.match(chat, /v\\.speaker === "Red" \\|\\| \\(v\\.mode === "clone" \\&\\& !v\\.speaker\\)/);')
          marker = '''test("preset voices are not silently replaced by a saved Red sample", () => {'''
          extra = '''test("non-Red preset selection cannot enter the saved clone branch", () => {\n  assert.match(chat, /v\\.speaker === "Red"/);\n  assert.doesNotMatch(chat, /if \\(v\\.mode === "clone" \\|\\| v\\.speaker === "Red"\\)/);\n});\n\n'''
          if extra not in ts:
              ts = ts.replace(marker, extra + marker, 1)
          t.write_text(ts)
          PY
      - name: Verify targeted source contract
        run: |
          node --test tests/buddy-experience-contract.test.mjs
          npx tsc --noEmit
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "GiggleLootCoin"
          git config user.email "185636220+GiggleLootCoin@users.noreply.github.com"
          rm -f .github/workflows/apply-preset-voice-fix.yml
          git add src/components/studio/BuddyLiveChat.tsx tests/buddy-experience-contract.test.mjs .github/workflows/apply-preset-voice-fix.yml
          git commit -m "fix: keep selected preset voice out of Red clone path"
          git push

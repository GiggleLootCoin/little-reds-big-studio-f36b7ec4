name: "Build Red's Ultimate RVC Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-reds-ultimate-rvc-apk.yml

permissions:
  contents: write

jobs:
  build-rvc-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone RVC Android engine
        run: git clone --depth 1 https://github.com/ouor/RVC-Android.git rvc-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned release APK
        working-directory: rvc-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Align and sign APK for Android 12+
        working-directory: rvc-android
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          test -n "$APK"
          test -s "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -p -f 4 "$APK" app-release-aligned.apk

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          "$APKSIGNER" sign             --ks "$HOME/.android/debug.keystore"             --ks-pass pass:android             --ks-key-alias androiddebugkey             --key-pass pass:android             --out app-release.apk             app-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs app-release.apk
          test -s app-release.apk
          sha256sum app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reds-ultimate-rvc-android
          path: rvc-android/app-release.apk
          retention-days: 30

      - name: Publish free Gofile download
        env:
          APK: rvc-android/app-release.apk
        run: |
          set -e
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-delay 2 -sS -F "file=@$APK" https://upload.gofile.io/uploadfile)
          echo "$RESPONSE" | tee "$RUNNER_TEMP/gofile.json"
          URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          test -n "$URL"
          echo "Gofile download: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reds-ultimate-rvc-apk-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" rvc-android/app-release.apk --repo "$GITHUB_REPOSITORY" --title "Red's Ultimate RVC Android APK $GITHUB_RUN_NUMBER" --notes "Native on-device RVC. No Hugging Face inference GPU. APK is zip-aligned and signed for sideloading."

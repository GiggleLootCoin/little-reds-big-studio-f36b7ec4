name: "Build Red's Ultimate RVC Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-reds-ultimate-rvc-apk.yml

permissions:
  contents: write

jobs:
  build-rvc-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone RVC Android engine
        run: git clone --depth 1 https://github.com/ouor/RVC-Android.git rvc-android

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply LittleRedBigSmile launcher logo
        working-directory: rvc-android
        run: |
          set -e
          curl -L --fail --retry 3 -o little-red-big-smile-logo.png "https://raw.githubusercontent.com/GiggleLootCoin/little-reds-big-studio-f36b7ec4/main/1784996969001.png"
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("little-red-big-smile-logo.png").convert("RGBA")
          # Preserve the actual LittleRedBigSmile logo while fitting it safely inside
          # Android's launcher-icon mask.
          def fitted_square(size, padding=0.78, bg=(255,255,255,255)):
              canvas = Image.new("RGBA", (size, size), bg)
              logo = src.copy()
              max_w = int(size * padding)
              max_h = int(size * padding)
              logo.thumbnail((max_w, max_h), Image.Resampling.LANCZOS)
              x = (size - logo.width) // 2
              y = (size - logo.height) // 2
              canvas.alpha_composite(logo, (x, y))
              return canvas

          def foreground(size):
              canvas = Image.new("RGBA", (size, size), (0,0,0,0))
              logo = src.copy()
              logo.thumbnail((int(size*0.78), int(size*0.78)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo, ((size-logo.width)//2, (size-logo.height)//2))
              return canvas

          res = Path("app/src/main/res")
          for dens, px in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              d = res / f"mipmap-{dens}"
              d.mkdir(parents=True, exist_ok=True)
              fitted_square(px).save(d/"ic_launcher.png", "PNG")
              fitted_square(px).save(d/"ic_launcher_round.png", "PNG")

          for dens, px in {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}.items():
              d = res / f"mipmap-{dens}"
              d.mkdir(parents=True, exist_ok=True)
              fitted_square(px).save(d/"ic_launcher_background.png", "PNG")
              foreground(px).save(d/"ic_launcher_foreground.png", "PNG")
              foreground(px).convert("L").save(d/"ic_launcher_monochrome.png", "PNG")

          print("LittleRedBigSmile launcher logo applied.")
          PY

      - name: Build unsigned release APK
        working-directory: rvc-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Align and sign APK for Android 12+
        working-directory: rvc-android
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -1)
          test -n "$APK"
          test -s "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -p -f 4 "$APK" app-release-aligned.apk

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          "$APKSIGNER" sign             --ks "$HOME/.android/debug.keystore"             --ks-pass pass:android             --ks-key-alias androiddebugkey             --key-pass pass:android             --out app-release.apk             app-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs app-release.apk
          test -s app-release.apk
          sha256sum app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reds-ultimate-rvc-android
          path: rvc-android/app-release.apk
          retention-days: 30

      - name: Publish free Gofile download
        env:
          APK: rvc-android/app-release.apk
        run: |
          set -e
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-delay 2 -sS -F "file=@$APK" https://upload.gofile.io/uploadfile)
          echo "$RESPONSE" | tee "$RUNNER_TEMP/gofile.json"
          URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          test -n "$URL"
          echo "Gofile download: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reds-ultimate-rvc-apk-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" rvc-android/app-release.apk --repo "$GITHUB_REPOSITORY" --title "Red's Ultimate RVC Android APK $GITHUB_RUN_NUMBER" --notes "Native on-device RVC. No Hugging Face inference GPU. APK is zip-aligned and signed for sideloading."

name: "Build Red's Ultimate RVC Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-reds-ultimate-rvc-apk.yml

permissions:
  contents: write

jobs:
  build-rvc-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone RVC Android engine
        run: git clone --depth 1 https://github.com/ouor/RVC-Android.git rvc-android

      - name: Brand app
        working-directory: rvc-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/res/values/strings.xml")
          p.write_text(p.read_text().replace("RVC Android","Red's Ultimate RVC"))
          p=Path("app/src/main/java/com/ouor/rvcandroid/ui/ConversionScreen.kt")
          p.write_text(p.read_text().replace('Text("RVC Android")','Text("Red\\'s Ultimate RVC")'))
          PY
          cat > app/src/main/java/com/ouor/rvcandroid/ui/theme/Theme.kt <<'EOF'
          package com.ouor.rvcandroid.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val RedDark = darkColorScheme(
              primary = Color(0xFFFF4B57),
              onPrimary = Color.White,
              primaryContainer = Color(0xFF7F1822),
              onPrimaryContainer = Color(0xFFFFDAD9),
              secondary = Color(0xFFFF8A91),
              onSecondary = Color(0xFF4A0008),
              secondaryContainer = Color(0xFF6B1D25),
              onSecondaryContainer = Color(0xFFFFDADC),
              background = Color(0xFF08090D),
              onBackground = Color(0xFFF6F6F7),
              surface = Color(0xFF101218),
              onSurface = Color(0xFFF6F6F7),
              surfaceVariant = Color(0xFF252831),
              onSurfaceVariant = Color(0xFFC8C8D0),
          )

          @Composable
          fun RvcTheme(
              darkTheme: Boolean = true,
              content: @Composable () -> Unit,
          ) {
              MaterialTheme(colorScheme = RedDark, content = content)
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: rvc-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK
        working-directory: rvc-android
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reds-ultimate-rvc-android
          path: rvc-android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish free Gofile download
        env:
          APK: rvc-android/app/build/outputs/apk/release/app-release.apk
        run: |
          set -e
          RESPONSE=$(curl --fail-with-body --retry 3 --retry-delay 2 -sS -F "file=@$APK" https://upload.gofile.io/uploadfile)
          echo "$RESPONSE" | tee "$RUNNER_TEMP/gofile.json"
          URL=$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty')
          test -n "$URL"
          echo "Gofile download: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="reds-ultimate-rvc-apk-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" rvc-android/app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --title "Red's Ultimate RVC Android APK $GITHUB_RUN_NUMBER" --notes "Native on-device RVC. No Hugging Face inference GPU."

name: One-shot Buddy all-issues fix
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: remove Android localhost chat lag and finish preset previews' && github.event.head_commit.message != 'chore: remove one-shot Buddy fix workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Buddy latency and duplicate UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f"missing expected text in {path}: {old[:100]}")
              p.write_text(s.replace(old,new,1))
          replace('src/lib/local-qwen.ts','  if (storage?.getItem(ENABLE_KEY) === "false") return false;\n  if (storage?.getItem(ENABLE_KEY) === "true") return true;\n  return typeof window !== "undefined";','  // Only probe localhost when the user explicitly enabled a local Qwen server.\n  // Android does not have one by default, so the old browser-default path added up to 15 seconds of latency.\n  return storage?.getItem(ENABLE_KEY) === "true";')
          replace('src/components/studio/BuddyLiveChat.tsx','          }, 900);','          }, 500);')
          replace('src/routes/index.tsx','import { BuddyVoicePicker } from "@/components/studio/BuddyVoicePicker";\n','')
          replace('src/routes/index.tsx','            <BuddyWelcome onChoose={chooseBuddyTask} />\n            <BuddyVoicePicker />\n','            <BuddyWelcome onChoose={chooseBuddyTask} />\n')
          PY
      - name: Generate and bundle stored preset previews
        env:
          SITE_URL: https://little-reds-big-studio-f36b7ec4.gigglelootcoin.workers.dev
        run: |
          mkdir -p public/buddy-previews
          python3 <<'PY'
          import json, subprocess, pathlib, sys, os
          voices=[('amalthea','Penny'),('andromeda','Frankie'),('apollo','Mason'),('arcas','Ellis'),('aries','Benny'),('asteria','Dani'),('athena','Maren'),('atlas','Gus'),('aurora','Tessa'),('callista','Rae'),('cora','Lila'),('cordelia','Nell'),('delia','Pippa'),('draco','Alfie'),('electra','Sloane'),('harmonia','June'),('helena','Maggie'),('hera','Claire'),('hermes','Theo'),('hyperion','Callum'),('iris','Millie'),('janus','Savannah'),('juno','Ruby'),('jupiter','Grant'),('luna','Sadie'),('mars','Dean'),('minerva','Elise'),('neptune','Martin'),('odysseus','Jonah'),('ophelia','Zoe'),('orion','Benji'),('orpheus','Marcus'),('pandora','Harriet'),('phoebe','Peaches'),('pluto','Nate'),('saturn','Warren'),('selene','Brooke'),('thalia','Jess'),('theia','Chloe'),('vesta','Hannah'),('zeus','Victor')]
          base=os.environ['SITE_URL']+'/api/ai/tts'
          for speaker,label in voices:
            out=pathlib.Path('public/buddy-previews')/(speaker+'.mp3')
            payload=json.dumps({'capability':'tts','text':f'Hello. I am {label}, one of Buddy\'s selectable voices.','language':'English','speaker':speaker})
            r=subprocess.run(['curl','-fsS','--retry','3','--connect-timeout','10','--max-time','45','-X','POST',base,'-H','content-type: application/json','--data',payload,'-o',str(out)],capture_output=True,text=True)
            if r.returncode or not out.exists() or out.stat().st_size<1000:
              print(f'preview generation failed for {speaker}: {r.stderr[:500]}',file=sys.stderr); sys.exit(1)
          print(f'generated {len(voices)} stored preset previews')
          PY
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/lib/stored-preset-previews.ts'); s=p.read_text(); marker='const STORED_PRESET_PREVIEWS: Record<string, string> = {'; start=s.index(marker)+len(marker); end=s.index('\n};',start)
          voices=['amalthea','andromeda','apollo','arcas','aries','asteria','athena','atlas','aurora','callista','cora','cordelia','delia','draco','electra','harmonia','helena','hera','hermes','hyperion','iris','janus','juno','jupiter','luna','mars','minerva','neptune','odysseus','ophelia','orion','orpheus','pandora','phoebe','pluto','saturn','selene','thalia','theia','vesta','zeus']
          existing=s[start:end].strip(); additions='\n'.join(f'  {v}: "/buddy-previews/{v}.mp3",' for v in voices); s=s[:start]+'\n'+existing+'\n'+additions+s[end:]; p.write_text(s)
          PY
      - name: Commit source and preview assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/local-qwen.ts src/components/studio/BuddyLiveChat.tsx src/routes/index.tsx src/lib/stored-preset-previews.ts public/buddy-previews
          git commit -m 'fix: remove Android localhost chat lag and finish preset previews'
          git push origin main
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-buddy-all-issues.yml
          git commit -m 'chore: remove one-shot Buddy fix workflow'
          git push origin main

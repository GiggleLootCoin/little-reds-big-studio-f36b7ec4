name: Temporary lockfile regeneration

on:
  push:
    branches:
      - fix/restore-vite-devdep

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/restore-vite-devdep
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes detected."
          else
            git commit -m "chore: regenerate package-lock.json after restoring vite"
            git push origin HEAD:fix/restore-vite-devdep
          fi

      - name: Clean install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Audio artifact tests
        run: node --experimental-strip-types --test tests/audio-artifact.test.ts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

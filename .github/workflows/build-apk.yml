name: Build Little Red's Big Studio — Independent APK
# Rebuild current main so the installable APK contains the latest Android Buddy voice fixes.

on:
  pull_request:
    branches: [main, "fix/studio-hardening-2026-10-03"]
  push:
    branches: [main, "fix/final-android-release-and-gofile-20261005", "independent-studio-build-20261019"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Format source
        run: npx prettier --write .

      - name: Typecheck source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            {
              echo "### Independent build typecheck failure"
              echo
              echo '~~~text'
              tail -c 14000 "$RUNNER_TEMP/typecheck.log"
              echo
              echo '~~~'
            } > "$RUNNER_TEMP/typecheck-comment.md"
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --method POST --field body="$(cat "$RUNNER_TEMP/typecheck-comment.md")" || true
            cat "$RUNNER_TEMP/typecheck.log"
            exit "$CODE"
          fi
          cat "$RUNNER_TEMP/typecheck.log"

      - name: Lint source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint > "$RUNNER_TEMP/lint.log" 2>&1
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            {
              echo "### Independent build lint failure"
              echo
              echo '~~~text'
              tail -c 14000 "$RUNNER_TEMP/lint.log"
              echo
              echo '~~~'
            } > "$RUNNER_TEMP/lint-comment.md"
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --method POST --field body="$(cat "$RUNNER_TEMP/lint-comment.md")" || true
            cat "$RUNNER_TEMP/lint.log"
            exit "$CODE"
          fi
          cat "$RUNNER_TEMP/lint.log"

      - name: Run Buddy voice tests
        run: npm run test:voice

      - name: Verify local voice path
        run: npm run verify:local-voice

      - name: Build the complete production bundle
        run: npm run build

      - name: Verify emitted browser bundle
        run: npm run verify:browser-bundle

      - name: Package the verified client bundle into the APK
        run: |
          set -euo pipefail
          echo "Built HTML files:"
          find dist -maxdepth 6 -type f -name '*.html' -print
          CLIENT_DIR="dist/client"
          test -s "$CLIENT_DIR/_shell.html"
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a "$CLIENT_DIR"/. android/app/src/main/assets/
          mkdir -p android/app/src/main/assets/assets
          cp -a dist/assets/. android/app/src/main/assets/assets/
          test -s dist/android.html
          cp dist/android.html android/app/src/main/assets/index.html
          cp dist/android.html android/app/src/main/assets/android.html
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp 1784996969001.png android/app/src/main/res/drawable-nodpi/studio_launcher.png
          test -s android/app/src/main/res/drawable-nodpi/studio_launcher.png
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/android.html
          test "$(find android/app/src/main/assets -type f | wc -l)" -gt 3
          grep -q '<script type="module"' android/app/src/main/assets/index.html
          grep -q 'assets/' android/app/src/main/assets/index.html

      - name: Prepare Android SDK and signing
        env:
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT"
          curl -fsSLo "$RUNNER_TEMP/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/bin" "$RUNNER_TEMP/android-tools/cmdline-tools/lib" "$SDK_ROOT/cmdline-tools/latest/"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for i in $(seq 1 100); do printf 'y\n'; done | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/tmp/sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-36" >/tmp/sdk-install.log 2>&1
          if [ -n "$TWA_SIGNING_KEY_BASE64" ]; then
            echo "$TWA_SIGNING_KEY_BASE64" | base64 -d > android/app/release-key.jks
          else
            keytool -genkeypair -keystore android/app/release-key.jks -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Little Red's Big Studio"
          fi

      - name: Install pinned Gradle
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build native Android APK
        env:
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
          TWA_SIGNING_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gradle --no-daemon --stacktrace -p android assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1
          CODE=$?
          if [ "$CODE" -ne 0 ]; then
            {
              echo "### Independent Android build failure"
              echo
              echo '~~~text'
              echo "---- beginning ----"
              head -n 220 "$RUNNER_TEMP/gradle.log"
              echo "---- end ----"
              tail -n 220 "$RUNNER_TEMP/gradle.log"
              echo
              echo '~~~'
            } > "$RUNNER_TEMP/gradle-comment.md"
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --method POST --field body="$(cat "$RUNNER_TEMP/gradle-comment.md")" || true
            cat "$RUNNER_TEMP/gradle.log"
            exit "$CODE"
          fi
          cat "$RUNNER_TEMP/gradle.log"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$SDK_ROOT/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 24 "$APK"
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.littleredbigstudio.independent'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "application-label:'Little Red’s Big Studio — Independent'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -l "$APK" | grep -q "assets/index.html"
          unzip -l "$APK" | grep -q "assets/android.html"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-reds-big-studio-independent-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish free Gofile download
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          for ENDPOINT in "https://upload.gofile.io/uploadfile" "https://upload-na-nyc.gofile.io/uploadfile" "https://upload.gofile.is/uploadfile"; do
            if RESPONSE="$(curl --fail-with-body --retry 5 --retry-delay 3 -sS -F "file=@${APK}" "$ENDPOINT")"; then
              echo "$RESPONSE" > "$RUNNER_TEMP/gofile-response.json"
              DOWNLOAD_PAGE="$(jq -r '.data.downloadPage // empty' "$RUNNER_TEMP/gofile-response.json")"
              test -n "$DOWNLOAD_PAGE"
              echo "Gofile download: $DOWNLOAD_PAGE"
              echo "GOFILE_DOWNLOAD_PAGE=$DOWNLOAD_PAGE" >> "$GITHUB_ENV"
              printf '%s\n' "$DOWNLOAD_PAGE" > "$RUNNER_TEMP/gofile-download-page.txt"
              exit 0
            fi
          done
          echo "Gofile upload failed at every endpoint."
          exit 1

      - name: Publish persistent GitHub Release
        if: always() && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-independent-$GITHUB_RUN_NUMBER"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "Native Android build from $GITHUB_REF commit $GITHUB_SHA."
            echo
            echo "**Free Gofile download:** $GOFILE_DOWNLOAD_PAGE"
            echo
            echo "**APK SHA-256:**"
            sha256sum android/app/build/outputs/apk/release/app-release.apk
            echo
            echo "The APK contains the verified Studio web bundle and native Android Buddy voice/microphone bridge."\n            echo\n            echo "This release is the persistent fallback download when Gofile is unavailable."
          } > "$NOTES_FILE"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Little Red's Big Studio Independent APK $GITHUB_RUN_NUMBER" \
            --notes-file "$NOTES_FILE"

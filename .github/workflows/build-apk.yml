name: Build Little Red's Big Studio APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK and signing
        env:
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT"
          curl -fsSLo "$RUNNER_TEMP/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/bin" "$RUNNER_TEMP/android-tools/cmdline-tools/lib" "$SDK_ROOT/cmdline-tools/latest/"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for i in $(seq 1 100); do printf 'y\n'; done | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/tmp/sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-36" >/tmp/sdk-install.log 2>&1
          if [ -n "$TWA_SIGNING_KEY_BASE64" ]; then
            echo "$TWA_SIGNING_KEY_BASE64" | base64 -d > android/app/release-key.jks
          else
            keytool -genkeypair -keystore android/app/release-key.jks -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Little Red's Big Studio"
          fi

      - name: Build native Android APK
        env:
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
          TWA_SIGNING_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace -p android assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-reds-big-studio-apk-native
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish persistent GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-native-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Little Red's Big Studio Native APK $GITHUB_RUN_NUMBER" \
            --notes "Native Android WebView build from main commit $GITHUB_SHA; includes Android Text-to-Speech fallback for Buddy voice responses."

name: Build Little Red's Big Studio APK
# Rebuild current main so the installable APK contains the latest Android Buddy voice fixes.

on:
  pull_request:
    branches: [main, "fix/studio-hardening-2026-10-03"]
  push:
    branches: [main, "fix/android-buddy-voice-and-apk-2026-10-03", "fix/real-studio-apk-hardening-2026-10-03"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build the web UI bundle
        run: npx vite build

      - name: Package the verified client bundle into the APK
        run: |
          set -euo pipefail
          echo "Built HTML files:"
          find dist -maxdepth 6 -type f -name '*.html' -print
          CLIENT_DIR="dist/client"
          test -s "$CLIENT_DIR/_shell.html"
          test -s "$CLIENT_DIR/index.html" || true
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a "$CLIENT_DIR"/. android/app/src/main/assets/
          cp "$CLIENT_DIR/_shell.html" android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html
          echo "Bundled asset count: $(find android/app/src/main/assets -type f | wc -l)"

      - name: Prepare Android SDK and signing
        env:
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT"
          curl -fsSLo "$RUNNER_TEMP/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/bin" "$RUNNER_TEMP/android-tools/cmdline-tools/lib" "$SDK_ROOT/cmdline-tools/latest/"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for i in $(seq 1 100); do printf 'y\n'; done | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/tmp/sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-36" >/tmp/sdk-install.log 2>&1
          if [ -n "$TWA_SIGNING_KEY_BASE64" ]; then
            echo "$TWA_SIGNING_KEY_BASE64" | base64 -d > android/app/release-key.jks
          else
            keytool -genkeypair -keystore android/app/release-key.jks -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Little Red's Big Studio"
          fi

      - name: Install pinned Gradle
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build native Android APK
        env:
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
          TWA_SIGNING_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E "assets/index.html|assets/.*\.js" | head -20
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-reds-big-studio-apk-native
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish persistent GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/real-studio-apk-hardening-2026-10-03')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-native-hardening-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Little Red's Big Studio Native APK — Hardening Build $GITHUB_RUN_NUMBER" \
            --notes "Native Android WebView build of the real Little Red's Big Studio from hardening commit $GITHUB_SHA; includes Android Text-to-Speech fallback and microphone permission handling."

  deploy-download-page:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/real-studio-apk-hardening-2026-10-03'
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: little-reds-big-studio-apk-native
          path: site
      - name: Prepare download page
        run: |
          set -euo pipefail
          APK="site/app-release.apk"
          test -s "$APK"
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>Little Red's Big Studio</title></head>
          <body style="font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:32px;background:#111;color:#fff;text-align:center">
          <h1>Little Red's Big Studio</h1>
          <p>Native Android APK</p>
          <a href="./app-release.apk" download="Little-Reds-Big-Studio.apk" style="display:inline-block;padding:16px 24px;border-radius:14px;background:#fff;color:#111;text-decoration:none;font-weight:700">Download Little Red's Big Studio</a>
          </body></html>
          HTML
          printf 'APK size: '; stat -c '%s bytes' "$APK"
          printf 'APK SHA-256: '; sha256sum "$APK"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  publish-direct-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/real-studio-apk-hardening-2026-10-03'
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact APK artifact
        uses: actions/download-artifact@v4
        with:
          name: little-reds-big-studio-apk-native
          path: dist-apk
      - name: Publish APK to dedicated raw-download branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find dist-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          git init publish-apk
          cd publish-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout --orphan apk-download
          rm -rf ./*
          cp "../$APK" ./app-release.apk
          git add app-release.apk
          git commit -m "Publish Little Red's Big Studio APK"
          git push --force origin HEAD:apk-download

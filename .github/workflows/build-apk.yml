name: Build Little Red's Big Studio APK

on:
  push:
    branches: [main]
    paths:
      - 'twa/twa-manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Increment version code for the APK'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by Bubblewrap)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Bubblewrap CLI + core locally
        run: npm install --no-audit --no-fund --ignore-scripts --prefix ./twa @bubblewrap/cli@1.25.0 @bubblewrap/core@1.25.0

      - name: Prepare signing key + Bubblewrap config + Android SDK
        env:
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p ~/.bubblewrap
          echo '{"jdkPath": "'$JAVA_HOME_17_X64'", "androidSdkPath": "'$SDK_ROOT'"}' > ~/.bubblewrap/config.json
          echo "Bubblewrap config written to ~/.bubblewrap/config.json"
          if [ -n "$TWA_SIGNING_KEY_BASE64" ]; then
            echo "$TWA_SIGNING_KEY_BASE64" | base64 -d > twa/lrbs-release-key.jks
            echo "Signing key decoded."
          else
            echo "No release signing secret configured; APK will use debug signing."
            rm -f twa/lrbs-release-key.jks
          fi
          echo "Installing Android SDK to $SDK_ROOT..."
          mkdir -p "$SDK_ROOT"
          cd "$SDK_ROOT"
          curl -fsSLo cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          if [ -d cmdline-tools/bin ]; then
            mkdir -p cmdline-tools/latest/bin
            mv cmdline-tools/bin/* cmdline-tools/latest/bin/
            rmdir cmdline-tools/bin
          fi
          if [ -d cmdline-tools/lib ]; then
            mkdir -p cmdline-tools/latest/lib
            mv cmdline-tools/lib/* cmdline-tools/latest/lib/
            rmdir cmdline-tools/lib
          fi
          mkdir -p "$SDK_ROOT/bin"
          ln -sf ../cmdline-tools/latest/bin/sdkmanager "$SDK_ROOT/bin/sdkmanager"
          ln -sf ../cmdline-tools/latest/bin/avdmanager "$SDK_ROOT/bin/avdmanager" 2>/dev/null || true
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$SDK_ROOT" >/dev/null 2>&1 || true
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;36.1.0" --sdk_root="$SDK_ROOT"
          echo "Android SDK installed."

      - name: Initialize TWA project (non-interactive)
        working-directory: twa
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const manifestPath = 'twa-manifest.json';
            const jdkPath = process.env.JAVA_HOME;
            const targetDir = path.resolve('app');
            const manifestJson = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

            console.log('Package ID:', manifestJson.packageId);
            console.log('Host:', manifestJson.host);

            const corePath = path.join(process.cwd(), 'node_modules/@bubblewrap/core/dist/index.js');
            if (!fs.existsSync(corePath)) throw new Error(`@bubblewrap/core not found at ${corePath}`);
            const core = require(corePath);
            const { TwaManifest, TwaGenerator } = core;

            if (manifestJson.signingKey?.path && !path.isAbsolute(manifestJson.signingKey.path)) {
              manifestJson.signingKey.path = path.resolve(path.join(targetDir, '..'), manifestJson.signingKey.path);
            }

            if (!process.env.TWA_SIGNING_KEY_BASE64) {
              delete manifestJson.signingKey;
              console.log('Release signing configuration removed; using debug signing.');
            }

            const twaManifest = new TwaManifest(manifestJson);
            const error = twaManifest.validate();
            if (error) throw new Error(`Manifest validation error: ${error}`);
            if (jdkPath) manifestJson.jdkPath = jdkPath;

            fs.mkdirSync(targetDir, { recursive: true });
            const generator = new TwaGenerator();
            const log = {
              printMessage: (msg) => console.log('  [bubblewrap]', msg),
              printError: (msg) => console.error('  [bubblewrap:ERROR]', msg),
            };
            await generator.createTwaProject(targetDir, twaManifest, log);
            await twaManifest.saveToFile(path.join(targetDir, 'twa-manifest.json'));
            console.log('SUCCESS: TWA project generated');
          }

          main().catch(err => { console.error('FATAL:', err.message || err); process.exit(1); });
          NODE

      - name: Update Bubblewrap project
        working-directory: twa
        run: npx bubblewrap update --skipVersionUpgrade

      - name: Diagnose signing keystore
        working-directory: twa
        env:
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
        run: |
          if [ -f lrbs-release-key.jks ]; then
            echo "=== Release keystore detected ==="
            ls -lh lrbs-release-key.jks
            keytool -list -storetype PKCS12 -keystore lrbs-release-key.jks -storepass "$TWA_SIGNING_KEY_STORE_PASSWORD" 2>&1 | head -20 || true
            keytool -list -storetype JKS -keystore lrbs-release-key.jks -storepass "$TWA_SIGNING_KEY_STORE_PASSWORD" 2>&1 | head -20 || true
          else
            echo "=== No release keystore; debug signing path ==="
          fi

      - name: Build APK
        working-directory: twa
        env:
          TWA_SIGNING_KEY_ALIAS: key0
          TWA_SIGNING_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
        run: |
          set -euo pipefail
          npx bubblewrap build --type=apk

      - name: Verify APK output
        working-directory: twa
        run: |
          set -euo pipefail
          echo "=== Bubblewrap APK output ==="
          find . -maxdepth 2 -type f -name '*.apk' -print -exec ls -lh {} \;
          APK="app-release-signed.apk"
          if [ ! -s "$APK" ]; then
            APK="app-release-unsigned.apk"
          fi
          test -s "$APK"
          cp "$APK" app-release-signed.apk
          file app-release-signed.apk
          echo "Verified APK: $(stat -c '%s bytes' app-release-signed.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-reds-big-studio-apk
          path: twa/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

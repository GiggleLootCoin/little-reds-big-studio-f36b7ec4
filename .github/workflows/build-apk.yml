name: Build Little Red's Big Studio APK
# Rebuild current main so the installable APK contains the latest Android Buddy voice fixes.\n# Direct-download publishing is performed after a successful branch build.

on:
  pull_request:
    branches: [main, "fix/studio-hardening-2026-10-03"]
  push:
    branches: [main, "fix/android-buddy-voice-and-apk-2026-10-03", "fix/android-native-buddy-mic-20261004"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build the web UI bundle
        continue-on-error: true
        run: npx vite build

      - name: Package the verified client bundle into the APK
        run: |
          set -euo pipefail
          echo "Built HTML files:"
          find dist -maxdepth 6 -type f -name '*.html' -print
          CLIENT_DIR="dist/client"
          test -s "$CLIENT_DIR/_shell.html"
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a "$CLIENT_DIR"/. android/app/src/main/assets/
          cp "$CLIENT_DIR/_shell.html" android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html

      - name: Prepare Android SDK and signing
        env:
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT"
          curl -fsSLo "$RUNNER_TEMP/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/bin" "$RUNNER_TEMP/android-tools/cmdline-tools/lib" "$SDK_ROOT/cmdline-tools/latest/"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          for i in $(seq 1 100); do printf 'y\n'; done | "$SDKMANAGER" --licenses --sdk_root="$SDK_ROOT" >/tmp/sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;35.0.0" "platforms;android-36" >/tmp/sdk-install.log 2>&1
          if [ -n "$TWA_SIGNING_KEY_BASE64" ]; then
            echo "$TWA_SIGNING_KEY_BASE64" | base64 -d > android/app/release-key.jks
          else
            keytool -genkeypair -keystore android/app/release-key.jks -storepass android -keypass android -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Little Red's Big Studio"
          fi

      - name: Install pinned Gradle
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build native Android APK
        env:
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
          TWA_SIGNING_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          stat -c '%s bytes' "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-reds-big-studio-apk-native
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 9


      - name: Publish APK to GoFile
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/android-native-buddy-mic-20261004'
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          RESPONSE="$(curl -fsS --retry 3 -X POST -F "file=@$APK;filename=Little-Reds-Big-Studio-Native-Buddy-Mic.apk" https://upload.gofile.io/uploadfile)"
          echo "$RESPONSE"
          DOWNLOAD_PAGE="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("data",{}).get("downloadPage",""))')"
          test -n "$DOWNLOAD_PAGE"
          printf '%s\n' "$DOWNLOAD_PAGE" > APK_DOWNLOAD_URL.txt
          echo "GoFile download page: $DOWNLOAD_PAGE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add APK_DOWNLOAD_URL.txt
          git commit -m "docs: publish native Buddy APK GoFile link [skip ci]" || true
          git push origin HEAD:fix/android-native-buddy-mic-20261004

      - name: Publish persistent GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/android-native-buddy-mic-20261004')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-native-buddy-mic-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Little Red's Big Studio Native APK — Buddy Mic $GITHUB_RUN_NUMBER" \
            --notes "Native Android build from Buddy mic fix branch commit $GITHUB_SHA. Buddy speech input uses Android SpeechRecognizer directly instead of WebView getUserMedia; original Studio UI remains bundled in the APK."

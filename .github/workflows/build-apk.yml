name: Build Little Red's Big Studio APK

on:
  push:
    branches: [main]
    paths:
      - 'twa/twa-manifest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Increment version code for the APK'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by Bubblewrap)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Bubblewrap CLI + core locally
        run: npm install --no-audit --no-fund --ignore-scripts --prefix ./twa @bubblewrap/cli@1.25.0 @bubblewrap/core@1.25.0

      - name: Prepare signing key + Bubblewrap config + Android SDK
        env:
          TWA_SIGNING_KEY_BASE64: ${{ secrets.TWA_SIGNING_KEY_BASE64 }}
        run: |
          mkdir -p ~/.bubblewrap
          SDK_ROOT="$HOME/android-sdk"
          echo '{"jdkPath": "'$JAVA_HOME_17_X64'", "androidSdkPath": "'$SDK_ROOT'"}' > ~/.bubblewrap/config.json
          echo "Bubblewrap config written to ~/.bubblewrap/config.json"
          if [ -n "$TWA_SIGNING_KEY_BASE64" ]; then
            echo "$TWA_SIGNING_KEY_BASE64" | base64 -d > twa/lrbs-release-key.jks
            echo "Signing key decoded."
          else
            echo "::warning::TWA_SIGNING_KEY_BASE64 not set; building unsigned debug APK."
            touch twa/lrbs-release-key.jks
          fi
          echo "Installing Android SDK to $SDK_ROOT..."
          mkdir -p "$SDK_ROOT"
          cd "$SDK_ROOT"
          curl -sSLo cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          if [ -d cmdline-tools/bin ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/bin/* cmdline-tools/latest/ 2>/dev/null || true
            rmdir cmdline-tools/bin 2>/dev/null || true
          fi
          if [ -d cmdline-tools/lib ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/lib/* cmdline-tools/latest/ 2>/dev/null || true
            rmdir cmdline-tools/lib 2>/dev/null || true
          fi
          mkdir -p "$SDK_ROOT/bin"
          ln -sf ../cmdline-tools/latest/bin/sdkmanager "$SDK_ROOT/bin/sdkmanager"
          ln -sf ../cmdline-tools/latest/bin/avdmanager "$SDK_ROOT/bin/avdmanager" 2>/dev/null || true
          echo "y" | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$SDK_ROOT" > /dev/null 2>&1 || true
          echo "y" | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --no-progress --install "platform-tools" "build-tools;36.1.0" --sdk_root="$SDK_ROOT"
          echo "Android SDK installed."
          ls -la "$SDK_ROOT/bin" "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/build-tools" "$SDK_ROOT/platform-tools" || true

      - name: Initialize TWA project (non-interactive)
        working-directory: twa
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');

          async function main() {
            const manifestPath = process.argv[2] || 'twa-manifest.json';
            const jdkPath = process.argv[3] || process.env.JAVA_HOME;
            const targetDir = path.resolve('app');

            const manifestJson = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            console.log('Package ID:', manifestJson.packageId);
            console.log('Host:', manifestJson.host);

            // Use @bubblewrap/core installed locally in twa/node_modules
            const corePath = path.join(process.cwd(), 'node_modules/@bubblewrap/core/dist/index.js');
            if (!fs.existsSync(corePath)) {
              console.error('@bubblewrap/core not found at', corePath);
              process.exit(1);
            }
            const core = require(corePath);
            const { TwaManifest, TwaGenerator, JdkHelper } = core;

            // Resolve signing key path
            if (manifestJson.signingKey && manifestJson.signingKey.path && !path.isAbsolute(manifestJson.signingKey.path)) {
              manifestJson.signingKey.path = path.resolve(path.join(targetDir, '..'), manifestJson.signingKey.path);
              console.log('Signing key resolved to:', manifestJson.signingKey.path);
            }

            const twaManifest = new TwaManifest(manifestJson);
            const error = twaManifest.validate();
            if (error) {
              console.error('Manifest validation error:', error);
              process.exit(1);
            }
            console.log('Manifest validated OK');

            // Inject JDK path into manifest so build step uses it non-interactively
            if (jdkPath) {
              manifestJson.jdkPath = jdkPath;
              console.log('JDK path injected into manifest:', jdkPath);
            } else {
              console.warn('JAVA_HOME not set; build may prompt for JDK');
            }

            // Generate project
            if (!fs.existsSync(targetDir)) {
              fs.mkdirSync(targetDir, { recursive: true });
            }
            console.log('Generating TWA project into:', targetDir);
            const generator = new TwaGenerator();
            const log = {
              printMessage: (msg) => console.log('  [bubblewrap]', msg),
              printError: (msg) => console.error('  [bubblewrap:ERROR]', msg),
            };
            await generator.createTwaProject(targetDir, twaManifest, log);
            await twaManifest.saveToFile(path.join(targetDir, 'twa-manifest.json'));

            const files = [];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir)) {
                const full = path.join(dir, entry);
                const rel = path.relative(targetDir, full);
                if (fs.statSync(full).isDirectory()) walk(full);
                else files.push(rel);
              }
            }
            walk(targetDir);
            console.log('SUCCESS: TWA project generated');
            console.log('Files:', files.length, '(showing first 10):', files.slice(0, 10).join(', '));
          }

          main().catch(err => {
            console.error('FATAL:', err.message || err);
            process.exit(1);
          });
          NODE

      - name: Build APK
        working-directory: twa
        env:
          TWA_SIGNING_KEY_ALIAS: key0
          TWA_SIGNING_KEY_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_PASSWORD || 'android' }}
          TWA_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.TWA_SIGNING_KEY_STORE_PASSWORD || 'android' }}
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
        run: npx bubblewrap build --type=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-reds-big-studio-apk
          path: twa/app/build/outputs/apk/*.apk
          retention-days: 30
          compression-level: 9

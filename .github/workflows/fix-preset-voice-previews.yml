name: Fix preset voice previews

on:
  push:
    branches: [architecture/little-red-engine]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[preset-preview-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch preset preview proxy and preset test routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          previews = Path('src/lib/stored-preset-previews.ts')
          s = previews.read_text()
          names = ['Ryan','Aiden','Vivian','Serena','Uncle_Fu','Dylan','Eric','Ono_Anna','Sohee']
          for name in names:
              s = re.sub(
                  rf'(?m)^(\\s*){re.escape(name)}:\s*"https://huggingface\\.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/[^\"]+",$',
                  rf'\\1{name}: "/api/preset-preview/{name}",',
                  s,
              )
          previews.write_text(s)

          picker = Path('src/components/studio/BuddyVoicePicker.tsx')
          s = picker.read_text()
          old = 'const result = await runLittleRedJob("voice-clone", { speaker: normalizePresetSpeaker(current.speaker), language: current.language || "English", text: CLONE_TEXT, target_text: CLONE_TEXT, refText: REFERENCE_TRANSCRIPT }, { privacy: "personal", onStatus: setStatus });'
          new = 'const result = await runLittleRedJob("tts", { speaker: normalizePresetSpeaker(current.speaker), language: current.language || "English", text: CLONE_TEXT, target_text: CLONE_TEXT }, { privacy: "personal", onStatus: setStatus });'
          if old not in s:
              raise SystemExit('Preset test voice-clone call not found')
          picker.write_text(s.replace(old, new, 1))

          server = Path('src/server.ts')
          s = server.read_text()
          marker = 'const WEB_SEARCH_PATH = "/api/ai/web-search/";'
          if 'const PRESET_PREVIEW_PREFIX = "/api/preset-preview/";' not in s:
              insert = '''const PRESET_PREVIEW_PREFIX = "/api/preset-preview/";
const PRESET_PREVIEW_UPSTREAMS: Record<string, string> = {
  Ryan: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/ryan_English.wav",
  Aiden: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/aiden_English.wav",
  Vivian: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/vivian_English.wav",
  Serena: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/serena_English.wav",
  Uncle_Fu: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/uncle_fu_English.wav",
  Dylan: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/dylan_English.wav",
  Eric: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/eric_English.wav",
  Ono_Anna: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/ono_anna_English.wav",
  Sohee: "https://huggingface.co/datasets/malaiwah/qwen3-tts-customvoice-ab-clips/resolve/main/original/sohee_English.wav",
};
async function proxyPresetPreview(request: Request): Promise<Response | null> {
  const url = new URL(request.url);
  if (!url.pathname.startsWith(PRESET_PREVIEW_PREFIX)) return null;
  if (request.method !== "GET" && request.method !== "HEAD") return new Response("GET required", { status: 405 });
  const speaker = decodeURIComponent(url.pathname.slice(PRESET_PREVIEW_PREFIX.length)).trim();
  const upstreamUrl = PRESET_PREVIEW_UPSTREAMS[speaker];
  if (!upstreamUrl) return new Response("Unknown preset voice", { status: 404 });
  const upstream = await fetch(upstreamUrl, { method: request.method, redirect: "follow" });
  if (!upstream.ok) return new Response("Preset preview unavailable", { status: upstream.status });
  const headers = new Headers(upstream.headers);
  headers.set("content-type", headers.get("content-type") || "audio/wav");
  headers.set("cache-control", "public, max-age=86400");
  headers.delete("content-disposition");
  headers.delete("content-encoding");
  return new Response(upstream.body, { status: upstream.status, headers });
}
'''
              if marker not in s:
                  raise SystemExit('server marker not found')
              s = s.replace(marker, marker + '\n' + insert, 1)
          if 'const presetPreview = await proxyPresetPreview(request);' not in s:
              lines = s.splitlines()
              for i, line in enumerate(lines):
                  if 'proxyHfSpace(request)' in line:
                      lines[i:i] = ['  const presetPreview = await proxyPresetPreview(request);', '  if (presetPreview) return presetPreview;']
                      break
              else:
                  raise SystemExit('server request proxy insertion point not found')
              s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          server.write_text(s)
          PY

      - name: Add regression checks
        run: |
          grep -n 'api/preset-preview' src/lib/stored-preset-previews.ts
          grep -n 'runLittleRedJob("tts"' src/components/studio/BuddyVoicePicker.tsx
          grep -n 'proxyPresetPreview' src/server.ts
          node --test tests/buddy-voice-path.test.mjs
          npx tsc --noEmit
          npm run build

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/stored-preset-previews.ts src/components/studio/BuddyVoicePicker.tsx src/server.ts
          git diff --cached --check
          git commit -m 'fix: make preset previews and preset test routing real [preset-preview-fixed]'
          git push origin architecture/little-red-engine

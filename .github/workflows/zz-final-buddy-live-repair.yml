name: Final Buddy live repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Final Buddy live repair applied')"
    runs-on: ubuntu-latest
    steps:
      - name: Apply source fixes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            async function get(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              return { sha: r.data.sha, content: Buffer.from(r.data.content, 'base64').toString('utf8') };
            }
            async function put(path, sha, content, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, sha, branch: 'main', message,
                content: Buffer.from(content, 'utf8').toString('base64')
              });
            }
            const chatPath = 'src/components/studio/BuddyLiveChat.tsx';
            const chat = await get(chatPath);
            let chatText = chat.content;
            const oldVoice = '          "voice-clone",\n          {\n            refAudio: sample,';
            const newVoice = '          "tts",\n          {\n            refAudio: sample,';
            if (!chatText.includes(oldVoice)) core.setFailed('Expected Buddy Red voice call was not found.');
            else chatText = chatText.replace(oldVoice, newVoice);
            const oldHistory = '        { role: "user", content },';
            const newHistory = '        { role: "user", content: Array.isArray(content) && content.length === 1 ? clean : content },';
            if (!chatText.includes(newHistory)) {
              if (!chatText.includes(oldHistory)) core.setFailed('Expected Buddy current-turn history line was not found.');
              else chatText = chatText.replace(oldHistory, newHistory);
            }
            const oldIdentity = 'Use conversation context when provided.";';
            const newIdentity = 'Use conversation context when provided. The final user message is the current turn: answer that message directly, do not repeat an earlier answer unless the user explicitly asks you to repeat it.";';
            if (chatText.includes(oldIdentity) && !chatText.includes('The final user message is the current turn')) chatText = chatText.replace(oldIdentity, newIdentity);
            await put(chatPath, chat.sha, chatText, 'Fix Buddy live Red voice and current-turn chat');
            const triggerPath = 'scripts/red-default-repair-trigger.txt';
            try {
              const trigger = await get(triggerPath);
              await github.rest.repos.deleteFile({ owner, repo, path: triggerPath, sha: trigger.sha, branch: 'main', message: 'Remove temporary repair trigger' });
            } catch {}
            const workflowPath = '.github/workflows/zz-final-buddy-live-repair.yml';
            const wf = await get(workflowPath);
            await github.rest.repos.deleteFile({ owner, repo, path: workflowPath, sha: wf.sha, branch: 'main', message: 'Remove one-time Buddy live repair' });

name: One-time Red default repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Red default migration
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'src/lib/buddy-voice.ts';
            const workflow = '.github/workflows/one-time-red-default-repair.yml';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const content = Buffer.from(file.data.content, 'base64').toString('utf8');
            const oldDefault = `const DEFAULT_PROFILE: BuddyVoiceProfile = {
              mode: "preset",
              speaker: "Ryan",
              language: "English",
              mood: "natural",
              tone: "conversational",
            };`;
            const newDefault = `const RED_DEFAULT_MIGRATION_KEY = "lrbgs-red-default-v1";
            const DEFAULT_PROFILE: BuddyVoiceProfile = {
              mode: "preset",
              speaker: "Red",
              language: "English",
              mood: "natural",
              tone: "conversational",
            };`;
            if (!content.includes(oldDefault)) core.setFailed('DEFAULT_PROFILE block not found');
            else {
              let next = content.replace(oldDefault, newDefault);
              const oldFn = `    const selected = parsed ?? legacyProfile();
            return {
              ...DEFAULT_PROFILE,
              ...selected,`;
              const newFn = `    const selected = parsed ?? legacyProfile();
            const migrated = localStorage.getItem(RED_DEFAULT_MIGRATION_KEY) !== "1";
            if (migrated) {
              const redDefault = {
                ...DEFAULT_PROFILE,
                language: selected?.language || DEFAULT_PROFILE.language,
                mood: selected?.mood || DEFAULT_PROFILE.mood,
                tone: selected?.tone || DEFAULT_PROFILE.tone,
              };
              localStorage.setItem(RED_DEFAULT_MIGRATION_KEY, "1");
              saveBuddyVoiceProfile(redDefault);
              return redDefault;
            }
            return {
              ...DEFAULT_PROFILE,
              ...selected,`;
              if (!next.includes(oldFn)) core.setFailed('getBuddyVoiceProfile anchor not found');
              else {
                next = next.replace(oldFn, newFn);
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path,
                  message: 'Fix Red voice default migration',
                  content: Buffer.from(next, 'utf8').toString('base64'),
                  sha: file.data.sha,
                  branch: 'main'
                });
                await github.rest.repos.deleteFile({
                  owner, repo, path: workflow,
                  message: 'Remove one-time Red default repair',
                  sha: (await github.rest.repos.getContent({ owner, repo, path: workflow, ref: 'main' })).data.sha,
                  branch: 'main'
                });
              }
            }

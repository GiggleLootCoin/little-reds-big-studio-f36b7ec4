name: Verify dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Verify lockfile is synchronized
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
          git diff --exit-code -- package-lock.json

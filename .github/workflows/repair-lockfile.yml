name: Repair dependency lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Commit synchronized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized.'
          else
            git commit -m 'fix: synchronize npm lockfile [lockfile-repaired]'
            git push origin main
          fi

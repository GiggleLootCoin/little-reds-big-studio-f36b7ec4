name: Fix Red default migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact migration guard and remove workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const path = 'src/lib/buddy-voice.ts';
            const wf = '.github/workflows/fix-red-default-migration.yml';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            let content = Buffer.from(file.data.content, 'base64').toString('utf8');
            const old = 'localStorage.getItem(RED_DEFAULT_MIGRATION_KEY) !== "1" && isLegacyRyanDefault(selected);';
            const replacement = 'localStorage.getItem(RED_DEFAULT_MIGRATION_KEY) !== "1" && (selected == null || isLegacyRyanDefault(selected));';
            if (!content.includes(old)) throw new Error('Expected Red migration guard was not found; refusing to modify the file.');
            content = content.replace(old, replacement);
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch: 'main', sha: file.data.sha, message: 'Fix Red default migration guard', content: Buffer.from(content).toString('base64') });
            const wfFile = await github.rest.repos.getContent({ owner, repo, path: wf, ref: 'main' });
            await github.rest.repos.deleteFile({ owner, repo, path: wf, branch: 'main', sha: wfFile.data.sha, message: 'Remove temporary Red migration fix workflow' });

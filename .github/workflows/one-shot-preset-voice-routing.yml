name: One-shot preset voice routing fix
on:
  push:
    branches: [fix/buddy-preset-voice-routing-real-selection-20260911]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: remove one-shot preset voice routing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply authoritative preset speech route
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/BuddyLiveChat.tsx')
          s = p.read_text()
          old = '''import { getBuddyVoiceProfile, getBuddyVoiceSample } from "@/lib/buddy-voice";\n'''
          new = old + 'import { buildPresetTtsRequest } from "@/lib/buddy-preset-voice-routing";\n'
          if old not in s:
              raise SystemExit('missing BuddyLiveChat voice import')
          s = s.replace(old, new, 1)
          old = '''      } else\n        r = await runStudioJob(\n          "tts",\n          {\n            text,\n            target_text: text,\n            language: v.language || "English",\n            speaker: v.speaker,\n            model_size: "1.7B",\n            mood: v.mood || "natural",\n            tone: v.tone || "conversational",\n          },\n          setStatus,\n        );\n'''
          new = '''      } else {\n        const preset = buildPresetTtsRequest(v, text);\n        setStatus(`Speaking with ${preset.speaker}…`);\n        const response = await fetch("/api/ai/tts", {\n          method: "POST",\n          headers: { "content-type": "application/json" },\n          body: JSON.stringify({\n            capability: "tts",\n            text: preset.text,\n            target_text: preset.text,\n            language: preset.language,\n            speaker: preset.speaker,\n            mood: preset.mood,\n            tone: preset.tone,\n          }),\n        });\n        if (!response.ok) {\n          const detail = (await response.text().catch(() => "")).slice(0, 300);\n          throw Error(`Preset voice generation failed (${response.status}). ${detail}`.trim());\n        }\n        const blob = await response.blob();\n        if (!blob.size) throw Error("Preset voice generation returned empty audio.");\n        r = {\n          url: URL.createObjectURL(blob),\n          provider: response.headers.get("x-voice-provider") || `Preset TTS (${preset.speaker})`,\n        };\n      }\n'''
          if old not in s:
              raise SystemExit('missing BuddyLiveChat preset branch')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('BuddyLiveChat preset route patched')
          PY
      - name: Verify regression contract
        run: |
          npm ci --ignore-scripts --legacy-peer-deps
          node --test tests/buddy-preset-voice-routing.test.mjs
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/studio/BuddyLiveChat.tsx
          git commit -m 'fix: route selected Buddy presets directly to Aura TTS'
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/one-shot-preset-voice-routing.yml
          git commit -m 'chore: remove one-shot preset voice routing fix'
          git push

name: Final Red migration fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix Red migration and remove this workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const path = 'src/lib/buddy-voice.ts';
            const wf = '.github/workflows/final-red-migration-fix.yml';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            let content = Buffer.from(file.data.content, 'base64').toString('utf8');
            content = content.replace('const RED_DEFAULT_MIGRATION_KEY = "lrbgs-red-default-v1";', 'const RED_DEFAULT_MIGRATION_KEY = "lrbgs-red-default-v2";');
            if (!content.includes('function isLegacyRyanDefault')) {
              const marker = 'export function getBuddyVoiceProfile(): BuddyVoiceProfile {';
              const helper = 'function isLegacyRyanDefault(profile: Partial<BuddyVoiceProfile> | null): boolean {\n  return Boolean(profile && profile.mode === "preset" && (!profile.speaker || profile.speaker === "Ryan"));\n}\n';
              content = content.replace(marker, helper + marker);
            }
            const old = '    const migrated = localStorage.getItem(RED_DEFAULT_MIGRATION_KEY) !== "1";';
            const replacement = '    const migrated = localStorage.getItem(RED_DEFAULT_MIGRATION_KEY) !== "1" && (selected == null || isLegacyRyanDefault(selected));';
            content = content.replace(old, replacement);
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch: 'main', sha: file.data.sha, message: 'Use v2 Red default migration', content: Buffer.from(content).toString('base64') });
            const wfFile = await github.rest.repos.getContent({ owner, repo, path: wf, ref: 'main' });
            await github.rest.repos.deleteFile({ owner, repo, path: wf, branch: 'main', sha: wfFile.data.sha, message: 'Remove temporary Red migration fix' });

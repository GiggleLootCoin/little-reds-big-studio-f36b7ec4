name: Final Runtime Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Final Runtime Fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted reliability fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Never fall back from a failed Aura-2 request by immediately returning 503.
          #    MeloTTS is the configured free server-side fallback and must get a chance.
          p = Path('src/server.ts')
          s = p.read_text()
          old = '''      if (\n        (lang === "en" && AURA_EN_SPEAKERS.has(auraSpeaker)) ||\n        (lang === "es" && AURA_ES_SPEAKERS.has(auraSpeaker))\n      )\n        return jsonError(\n          `The selected voice (${requested || auraSpeaker}) could not produce audio.${isCapacityError(lastError) ? " The AI service is at capacity." : ""}`,\n          503,\n        );\n'''
          new = '''      // Aura-2 is the preferred preset-voice engine. If it is unavailable,\n      // continue to the free MeloTTS fallback instead of failing the whole request.\n'''
          if old not in s:
              raise SystemExit('Expected Aura failure block was not found')
          p.write_text(s.replace(old, new, 1))

          # 2. Do not silently regress preset Qwen TTS from 1.7B to the old 0.6B model.
          p = Path('src/lib/studio-runtime-impl.ts')
          s = p.read_text()
          old = '    for (const size of [String(input.model_size ?? "1.7B"), "0.6B"])'
          new = '    for (const size of [String(input.model_size ?? "1.7B")])'
          if old not in s:
              raise SystemExit('Expected Qwen 0.6B fallback was not found')
          p.write_text(s.replace(old, new, 1))

          # 3. Allow the higher-level clone wrapper to skip a failed primary provider
          #    and exercise the next configured free clone engine.
          p = Path('src/lib/studio-runtime-impl.ts')
          s = p.read_text()
          old = '''  const prepared = await prepareVoice(capability, input);\n  const providers = runnersFor(prepared.capability);\n  const failures: string[] = [];\n  for (const provider of providers) {\n'''
          new = '''  const prepared = await prepareVoice(capability, input);\n  const skipped = new Set(\n    Array.isArray(prepared.input._skipProviders)\n      ? prepared.input._skipProviders.map((value) => String(value))\n      : [],\n  );\n  const providers = runnersFor(prepared.capability).filter((provider) => !skipped.has(provider.id));\n  const failures: string[] = [];\n  for (const provider of providers) {\n'''
          if old not in s:
              raise SystemExit('Expected provider loop was not found')
          p.write_text(s.replace(old, new, 1))

          # 4. Give voice cloning a real free fallback after Qwen fails.
          p = Path('src/lib/studio-runtime.ts')
          s = p.read_text()
          s = s.replace('import { saveVoiceSample } from "./voice-profile";\n', 'import { saveVoiceSample } from "./voice-profile";\nimport { normalizeAndVerifyBrowserAudio } from "./audio-artifact";\nimport { saveBuddyClonePreview } from "./buddy-voice";\n', 1)
          old = '''  const result = await createBestFreeVoiceClone(sample, refText, text, language, onStatus);\n  if (!result.url) throw new Error("The voice engine returned no playable audio.");\n'''
          new = '''  let result;\n  try {\n    result = await createBestFreeVoiceClone(sample, refText, text, language, onStatus);\n  } catch (primaryError) {\n    onStatus?.("Qwen clone was unavailable. Trying the free Chatterbox voice-clone fallback…");\n    try {\n      const runtime = await import("./studio-runtime-impl");\n      const fallback = await runtime.runStudioJob(\n        "voice-clone",\n        {\n          refAudio: sample,\n          referenceAudio: sample,\n          audio: sample,\n          refText,\n          referenceTranscript: refText,\n          target_text: text,\n          text,\n          language,\n          _skipProviders: ["hf-qwen3-tts"],\n        },\n        onStatus,\n      );\n      if (!fallback.url) throw primaryError;\n      const fallbackBlob = await fetch(fallback.url).then((response) => {\n        if (!response.ok) throw new Error(`Fallback audio download failed (${response.status}).`);\n        return response.blob();\n      });\n      const normalized = await normalizeAndVerifyBrowserAudio(fallbackBlob);\n      if (normalized.stats.duration <= 0 || normalized.stats.peak <= 0 || normalized.stats.rms <= 0)\n        throw new Error("Fallback clone returned silent or unusable audio.");\n      await saveBuddyClonePreview(normalized.blob, fallback.provider);\n      result = {\n        url: normalized.url,\n        provider: fallback.provider,\n        verification: `Free fallback ${fallback.provider} + browser audio decode + non-silent artifact verification`,\n        duration: normalized.stats.duration,\n        peak: normalized.stats.peak,\n        rms: normalized.stats.rms,\n      };\n    } catch (fallbackError) {\n      throw new Error(\n        `Voice cloning failed on Qwen and the free fallback. ${\n          fallbackError instanceof Error ? fallbackError.message : String(primaryError)\n        }`,\n      );\n    }\n  }\n  if (!result.url) throw new Error("The voice engine returned no playable audio.");\n'''
          if old not in s:
              raise SystemExit('Expected clone wrapper was not found')
          p.write_text(s.replace(old, new, 1))

          # 5. Remove this one-shot maintenance workflow after it has applied the changes.
          Path('.github/workflows/final-runtime-fix.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/lib/studio-runtime-impl.ts src/lib/studio-runtime.ts .github/workflows/final-runtime-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden free runtime fallbacks"
          git push
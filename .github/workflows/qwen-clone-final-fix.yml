name: Qwen clone final fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Qwen clone
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/studio-runtime-impl.ts')
          s=p.read_text()
          s=s.replace('const sources = typeof window === "undefined" ? [id] : [proxyOrigin(id), id];','const sources = typeof window === "undefined" ? [id] : [id, proxyOrigin(id)];',1)
          s=s.replace('for (const size of [String(input.model_size ?? "0.6B"), "1.7B"])','for (const size of [String(input.model_size ?? "1.7B"), "0.6B"])',1)
          s=s.replace('        !refText,\n        size,','        false,\n        size,',1)
          old='  if (profile.mode === "clone") {\n    const sample = await getBuddyVoiceSample();'
          new='  if (profile.mode === "clone") {\n    if (!profile.cloneVerified) throw new Error("Your custom voice is not verified yet. Generate and verify the clone first.");\n    if (!profile.referenceTranscript?.trim()) throw new Error("Your custom voice needs a verified reference transcript before Buddy can speak with it.");\n    const sample = await getBuddyVoiceSample();'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -n 'const sources\|model_size\|cloneVerified\|referenceTranscript' src/lib/studio-runtime-impl.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/studio-runtime-impl.ts
          git commit -m 'fix: finalize qwen clone routing and verification'
          git push origin HEAD:main

name: Free Open Agentic Validation

on:
  push:
    branches:
      - main
      - fix/buddy-chatterbox-runtime-contract
      - upgrade/buddy-free-open-agentic
      - upgrade/buddy-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Create flow contract tests
        run: node --test tests/create-flow-contract.test.mjs

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Check application formatting
        run: npx prettier --check .

      - name: Lint application
        run: npm run lint

      - name: Build production bundle
        run: npm run build

name: Security & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Normalize formatting
        run: npx prettier --write .
      - name: Prettier check
        run: npx prettier --check .
      - name: ESLint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build

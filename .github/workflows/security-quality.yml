name: Security & Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Normalize formatting
        run: npx prettier --write .
      - name: Prettier check
        run: npx prettier --check .
      - name: ESLint
        run: npm run lint
      - name: Static local Buddy voice-path verification
        run: npm run verify:local-voice
      - name: Production build
        run: npm run build
      - name: Verify browser voice production bundle
        run: npm run verify:browser-bundle
      - name: Dependency audit
        run: npm audit --audit-level=high

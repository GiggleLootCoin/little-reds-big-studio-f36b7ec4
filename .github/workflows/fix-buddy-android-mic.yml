name: Fix Buddy Android mic
on:
  push:
    branches: [main]
jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: route Buddy Android live chat through phone mic' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Android live capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/studio/BuddyLiveChat.tsx')
          s = p.read_text()
          old = 'if (mode === "live" && startBrowserRecognition("live")) return;'
          new = 'if (mode === "live" && !/Android/i.test(navigator.userAgent) && startBrowserRecognition("live")) return;'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name 'Buddy Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/studio/BuddyLiveChat.tsx
          git commit -m 'fix: route Buddy Android live chat through phone mic'
          git push

name: Verify preset preview is playback-only
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Verification-only workflow; production code is never patched by CI.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preset preview is playback-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/components/studio/BuddyVoicePicker.tsx').read_text()
          start = s.index('const previewPreset = () =>')
          end = s.index('  const test = async () =>', start)
          block = s[start:end]
          assert '/api/ai/tts' not in block
          assert 'runStudioJob' not in block
          assert 'runLittleRedJob' not in block
          assert 'getStoredPresetPreview' in block
          print('OK: preset Preview Voice is stored-audio playback only.')
          PY

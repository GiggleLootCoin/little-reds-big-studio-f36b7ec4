name: Verify preset preview is playback-only
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify preset preview has no TTS generation call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/components/studio/BuddyVoicePicker.tsx').read_text()
          start = s.index('const previewPreset = async () =>')
          end = s.index('  const test = async () =>', start)
          block = s[start:end]
          if '/api/ai/tts' in block or 'runStudioJob' in block:
              raise SystemExit('Preset preview must not call a generation route.')
          if 'getStoredPresetPreview' not in block:
              raise SystemExit('Preset preview must use stored audio assets.')
          print('OK: preset Preview Voice is playback-only and uses stored preview assets.')
          PY

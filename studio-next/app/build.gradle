plugins { id 'com.android.application' }

android {
    namespace 'com.littleredbigstudio.next'
    compileSdk 35
    defaultConfig {
        applicationId 'com.littleredbigstudio.next'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0-next'
    }
    buildTypes {
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

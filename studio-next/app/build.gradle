plugins { id 'com.android.application' }

android {
    namespace 'com.littleredbigstudio.next'
    compileSdk 35
    defaultConfig {
        applicationId 'com.littleredbigstudio.next'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '2.0.0-next'
    }
    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword System.getenv("STUDIO_SIGNING_STORE_PASSWORD") ?: "android"
            keyAlias "key0"
            keyPassword System.getenv("STUDIO_SIGNING_KEY_PASSWORD") ?: "android"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
